<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi resumen — Matrimonio 2026</title>
<link rel="stylesheet" href="style.css">
<style>
.hero-card {
  border-radius: 20px;
  padding: 28px 24px 24px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.hero-card.r { background: linear-gradient(135deg, var(--r-color) 0%, #7c3aed 100%); color: #fff; }
.hero-card.c { background: linear-gradient(135deg, var(--c-color) 0%, #0891b2 100%); color: #fff; }
.hero-card.s { background: linear-gradient(135deg, var(--s-color) 0%, #059669 100%); color: #fff; }
.hero-label { font-size: 13px; opacity: .8; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 6px; }
.hero-amount { font-size: 40px; font-weight: 800; line-height: 1; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.hero-sub { font-size: 13px; opacity: .75; }
.hero-progress { margin-top: 20px; }
.hero-track { background: rgba(255,255,255,.25); border-radius: 99px; height: 10px; overflow: hidden; }
.hero-fill { height: 100%; border-radius: 99px; background: rgba(255,255,255,.85); transition: width .6s ease; }
.hero-pct { font-size: 13px; opacity: .9; margin-top: 6px; font-weight: 600; }

.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.sum-tile { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.sum-label { font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.sum-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--fg); }
.sum-sub { font-size: 12px; color: var(--fg-faint); margin-top: 3px; }

.item-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
.item-line { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--card-bg); }
.item-line:last-child { border-bottom: none; }
.item-name { flex: 1; font-size: 13px; font-weight: 500; color: var(--fg); }
.item-name.est { color: var(--fg-muted); font-style: italic; }
.item-amounts { text-align: right; flex-shrink: 0; }
.item-share { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg); }
.item-paid { font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.item-bar-wrap { width: 60px; flex-shrink: 0; }
.item-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
.item-bar-fill { height: 100%; border-radius: 99px; transition: width .4s; }
.item-pct { font-size: 10px; color: var(--fg-faint); text-align: right; margin-top: 2px; font-weight: 600; }

.banq-note { font-size: 12px; color: var(--fg-faint); background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 24px; }

.selector-wrap { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.sel-btn { flex: 1; min-width: 100px; padding: 12px 8px; border-radius: 10px; border: 2px solid var(--border); background: var(--card-bg); color: var(--fg-muted); font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; transition: all .15s; }
.sel-btn.r.active { border-color: var(--r-color); color: var(--r-color); background: color-mix(in srgb, var(--r-color) 10%, transparent); }
.sel-btn.c.active { border-color: var(--c-color); color: var(--c-color); background: color-mix(in srgb, var(--c-color) 10%, transparent); }
.sel-btn.s.active { border-color: var(--s-color); color: var(--s-color); background: color-mix(in srgb, var(--s-color) 10%, transparent); }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="index.html">💍 Matrimonio 2026</a>
    <ul class="site-nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="gastos.html">Gastos</a></li>
      <li><a href="invitados.html">Invitados</a></li>
      <li><a href="pagos.html">Pagos</a></li>
      <li><a href="familia.html">Mi resumen</a></li>
    </ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
  </div>
</nav>

<main class="page">
  <h1 class="page-title" id="page-title">Mi resumen</h1>
  <p class="page-subtitle" style="margin-bottom:20px">Matrimonio Riedel Palma &amp; Solís Soto · 2026</p>

  <!-- Selector de familia (solo visible sin parámetro en URL) -->
  <div class="selector-wrap" id="selector-wrap">
    <button class="sel-btn r" onclick="setFam('r')">Riedel Palma</button>
    <button class="sel-btn c" onclick="setFam('c')">Chico</button>
    <button class="sel-btn s" onclick="setFam('s')">Solís Soto</button>
  </div>

  <div id="root"><div class="loading"><div class="spinner"></div> Cargando…</div></div>
</main>

<script type="module">
import { apiFetch, fmt, initTheme, highlightNav } from './api.js';

initTheme();
highlightNav();

const ITEMS_FIXED = [
  { item:'Centro de Eventos', rn:4423284, rb:5263708, cn:2211642, cb:2631854, sn:2211642, sb:2631854 },
  { item:'DJ',                rn:777311,  rb:925000,  cn:388655,  cb:462500,  sn:388655,  sb:462500  },
  { item:'Fotógrafo',         rn:756303,  rb:900000,  cn:378151,  cb:450000,  sn:378151,  sb:450000  },
  { item:'Videógrafo',        rn:546218,  rb:650000,  cn:273109,  cb:325000,  sn:273109,  sb:325000  },
  { item:'Maquilladora',      rn:0,       rb:0,       cn:0,       cb:0,       sn:0,       sb:0,       est:true },
  { item:'Comida extra',      rn:30000,   rb:35700,   cn:15000,   cb:17850,   sn:15000,   sb:17850   },
  { item:'Pista de Baile',    rn:261765,  rb:311500,  cn:130882,  cb:155750,  sn:130882,  sb:155750  },
  { item:'Ceremonia',         rn:0,       rb:0,       cn:0,       cb:0,       sn:0,       sb:0,       est:true },
  { item:'Saxofonista',       rn:105042,  rb:125000,  cn:52521,   cb:62500,   sn:52521,   sb:62500   },
  { item:'Flores',            rn:800000,  rb:952000,  cn:400000,  cb:476000,  sn:400000,  sb:476000,  est:true },
  { item:'Extras',            rn:4292500, rb:5108075, cn:2146250, cb:2554038, sn:2146250, sb:2554038, est:true },
];

const LABELS = { r: 'Riedel Palma', c: 'Chico', s: 'Solís Soto' };
const root = document.getElementById('root');

let fam = 'r';
let banqData = null;
let pagosData = null;

// Leer param de URL — si viene con ?f=, es link personal: ocultar selector
const urlParam = new URLSearchParams(location.search).get('f');
const hasParam = urlParam && ['r','c','s'].includes(urlParam);
if (hasParam) {
  fam = urlParam;
  document.getElementById('selector-wrap').style.display = 'none';
}

function buildItems(banq) {
  const items = ITEMS_FIXED.slice();
  if (banq && !banq.error) {
    items.push({
      item: 'Banquetera',
      rb: banq.rb||0, rn: banq.rn||0,
      cb: banq.cb||0, cn: banq.cn||0,
      sb: banq.sb||0, sn: banq.sn||0,
      pr: 0, pc: 0, ps: 0,
    });
  }
  return items;
}

const SHARED_ITEM_NAMES = ['ceremonia', 'maquilladora'];

function computeDeuda(pagos, myKey) {
  // Solo ítems compartidos (sin presupuesto fijo): una familia puede pagar por las tres.
  // Cada una debe 50/25/25. Si pagué más de mi parte → me deben; si pagué menos → debo.
  const SPLITS = { r: 0.50, c: 0.25, s: 0.25 };
  const byItem = {};
  (pagos||[]).forEach(p => {
    const k = p.familia === 'Riedel Palma' ? 'r' : p.familia === 'Chico' ? 'c' : 's';
    const m = Number(p.monto)||0;
    const c = String(p.concepto||'').toLowerCase();
    const match = SHARED_ITEM_NAMES.find(n => c.includes(n));
    if (!match) return;
    const key = match.charAt(0).toUpperCase() + match.slice(1);
    if (!byItem[key]) byItem[key] = { r:0, c:0, s:0 };
    byItem[key][k] += m;
  });

  // net[myKey] = lo que pagué - lo que debía = cuánto me deben (positivo) o debo (negativo)
  let netMine = 0;
  const breakdown = [];
  Object.entries(byItem).forEach(([nombre, ip]) => {
    const total = ip.r + ip.c + ip.s;
    if (!total) return;
    const debio = total * SPLITS[myKey];
    const pago  = ip[myKey];
    const diff  = pago - debio; // positivo = me deben, negativo = debo
    netMine += diff;
    breakdown.push({ nombre, total, pago, debio, diff });
  });

  return { netMine, breakdown };
}

function computeFromPagos(pagos, items) {
  const totalPaid = { r:0, c:0, s:0 };
  const itemPaid  = {};
  items.forEach(x => { itemPaid[x.item] = { r:0, c:0, s:0 }; });
  itemPaid['Banquetera'] = { r:0, c:0, s:0 };

  (pagos||[]).forEach(p => {
    const k = p.familia === 'Riedel Palma' ? 'r' : p.familia === 'Chico' ? 'c' : 's';
    const monto = Number(p.monto)||0;
    totalPaid[k] += monto;
    // Matchear concepto con nombre de ítem
    const concepto = String(p.concepto||'').toLowerCase();
    for (const nombre of Object.keys(itemPaid)) {
      if (concepto.startsWith(nombre.toLowerCase()) || concepto.includes(nombre.toLowerCase())) {
        itemPaid[nombre][k] += monto;
        break;
      }
    }
  });

  return { totalPaid, itemPaid };
}

function render() {
  const items  = buildItems(banqData);
  const { totalPaid: paid, itemPaid } = computeFromPagos(pagosData, ITEMS_FIXED);
  const k      = fam;
  const bKey   = k + 'b'; // rb / cb / sb

  // Para ítems sin precio fijo (rb=0), el "total" es lo que se ha pagado hasta ahora
  const totalShare  = items.reduce((s, x) => {
    const fixed = x[bKey]||0;
    return s + (fixed > 0 ? fixed : (itemPaid[x.item]||{})[k]||0);
  }, 0);
  const totalPaid   = paid[k];
  const totalPend   = Math.max(0, totalShare - totalPaid);
  const pct         = totalShare > 0 ? Math.min(100, Math.round(totalPaid / totalShare * 100)) : 0;

  // Actualizar selector (solo si está visible)
  if (!hasParam) {
    document.querySelectorAll('.sel-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.sel-btn.${k}`).classList.add('active');
  }
  document.getElementById('page-title').textContent = `Familia ${LABELS[k]}`;
  document.title = `${LABELS[k]} — Matrimonio 2026`;

  // Actualizar URL sin recargar
  history.replaceState(null,'',`?f=${k}`);

  // Un ítem est:true pasa a "contratado" en cuanto CUALQUIER familia lo haya pagado
  const anyFamPaid = x => {
    const ip = itemPaid[x.item] || {};
    return (ip.r||0) + (ip.c||0) + (ip.s||0) > 0;
  };
  const isEstFam = x => x.est && !anyFamPaid(x);

  const estItems  = items.filter(x =>  isEstFam(x) && ((x[bKey]||0) > 0 || (itemPaid[x.item]||{})[k] > 0));
  const realItems = items.filter(x => !isEstFam(x) && ((x[bKey]||0) > 0 || (itemPaid[x.item]||{})[k] > 0));
  const zeroItems = items.filter(x => !x.est && (x[bKey]||0) === 0 && !((itemPaid[x.item]||{})[k] > 0));

  // Pagos de esta familia, orden cronológico inverso
  const famPagos = (pagosData||[]).filter(p => {
    const pk = p.familia === 'Riedel Palma' ? 'r' : p.familia === 'Chico' ? 'c' : 's';
    return pk === k;
  }).slice().reverse();

  function itemLine(x) {
    const ipaid  = (itemPaid[x.item]||{})[k]||0;
    // Para ítems sin precio fijo, el "presupuesto" mostrado es lo pagado hasta ahora
    const share  = (x[bKey]||0) > 0 ? (x[bKey]||0) : ipaid;
    const ipct   = share > 0 ? Math.min(100, Math.round(ipaid / share * 100)) : 0;
    const color  = `var(--${k}-color)`;
    const shareLabel = (x[bKey]||0) > 0
      ? `$${fmt(share)}`
      : `<span style="color:var(--fg-faint);font-size:11px">acumulado</span>`;
    return `<div class="item-line">
      <div class="item-name${isEstFam(x)?' est':''}">${x.item}${isEstFam(x)?' ★':''}</div>
      <div class="item-bar-wrap">
        <div class="item-bar"><div class="item-bar-fill" style="width:${ipct}%;background:${color}"></div></div>
        <div class="item-pct" style="color:${color}">${ipct}%</div>
      </div>
      <div class="item-amounts">
        <div class="item-share">${shareLabel}</div>
        <div class="item-paid">pagado $${fmt(ipaid)}</div>
      </div>
    </div>`;
  }

  function pagoRow(p) {
    const comp = p.comprobante
      ? `<a href="${p.comprobante}" target="_blank" style="color:var(--${k}-color);font-size:11px;text-decoration:none">Ver →</a>`
      : '';
    return `<div class="item-line">
      <div style="font-size:11px;color:var(--fg-faint);flex-shrink:0;width:72px">${p.fecha||'—'}</div>
      <div class="item-name" style="font-size:13px">${p.concepto}</div>
      <div style="flex-shrink:0;text-align:right">
        <div style="font-size:13px;font-weight:600;font-variant-numeric:tabular-nums">$${fmt(p.monto)}</div>
        <div style="font-size:11px;margin-top:2px">${comp}</div>
      </div>
    </div>`;
  }

  root.innerHTML = `
    <div class="hero-card ${k}">
      <div class="hero-label">Tu parte del matrimonio</div>
      <div class="hero-amount">$${fmt(totalShare)}</div>
      <div class="hero-sub">bruto (con IVA)</div>
      <div class="hero-progress">
        <div class="hero-track"><div class="hero-fill" style="width:${pct}%"></div></div>
        <div class="hero-pct">${pct}% pagado</div>
      </div>
    </div>

    <div class="summary-grid">
      <div class="sum-tile">
        <div class="sum-label">Pagado</div>
        <div class="sum-value" style="color:var(--${k}-color)">$${fmt(totalPaid)}</div>
        <div class="sum-sub">${pct}% del total</div>
      </div>
      <div class="sum-tile">
        <div class="sum-label">Por pagar</div>
        <div class="sum-value" style="color:${totalPend>0?'var(--fg)':'var(--s-color)'}">$${fmt(totalPend)}</div>
        <div class="sum-sub">${totalPend > 0 ? 'pendiente' : '✓ al día'}</div>
      </div>
    </div>

    ${realItems.length ? `
    <div class="section-label">Ítems contratados</div>
    <div class="item-list">${realItems.map(itemLine).join('')}</div>
    ` : ''}

    ${estItems.length ? `
    <div class="section-label">Ítems por confirmar ★</div>
    <div class="banq-note">★ Montos estimados, aún no contratados. Pueden cambiar.</div>
    <div class="item-list">${estItems.map(itemLine).join('')}</div>
    ` : ''}

    ${zeroItems.length ? `
    <p style="font-size:12px;color:var(--fg-faint);margin:0 0 16px">
      Sin costo para tu familia: ${zeroItems.map(x=>x.item).join(' · ')}
    </p>
    ` : ''}

    ${famPagos.length ? `
    <div class="section-label" style="margin-top:8px">Historial de pagos</div>
    <div class="item-list" style="margin-bottom:16px">${famPagos.map(pagoRow).join('')}</div>
    ` : ''}

    ${(() => {
      const { netMine, breakdown } = computeDeuda(pagosData, k);
      if (!breakdown.length) return '';
      const fmt = n => '$' + Math.round(Math.abs(n)).toLocaleString('es-CL');
      const rows = breakdown.map(b => {
        const sign = b.diff > 0 ? '✅ te deben' : b.diff < 0 ? '⚠️ debes' : '✔ al día';
        const color = b.diff > 0 ? 'var(--green,#22c55e)' : b.diff < 0 ? 'var(--red,#ef4444)' : 'var(--fg-muted)';
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:13px">${b.nombre}</span>
          <div style="text-align:right">
            <span style="font-size:13px;font-weight:600;color:${color}">${b.diff !== 0 ? fmt(b.diff) : '✔'}</span>
            <span style="font-size:11px;color:var(--fg-muted);display:block">${sign} · pagaste ${fmt(b.pago)} de ${fmt(b.debio)}</span>
          </div>
        </div>`;
      }).join('');
      const totalColor = netMine > 0 ? 'var(--green,#22c55e)' : netMine < 0 ? 'var(--red,#ef4444)' : 'var(--fg-muted)';
      const totalLabel = netMine > 0 ? 'te deben en total' : netMine < 0 ? 'debes en total' : 'al día';
      return `
    <div class="section-label" style="margin-top:8px">Deuda entre familias</div>
    <div class="card" style="margin-bottom:16px">
      <p style="font-size:12px;color:var(--fg-muted);margin:0 0 10px">Solo aplica a costos compartidos (Ceremonia, Maquilladora) donde una familia puede adelantar por las otras.</p>
      ${rows}
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0 0">
        <span style="font-size:13px;font-weight:600">Total</span>
        <span style="font-size:14px;font-weight:700;color:${totalColor}">${netMine !== 0 ? fmt(netMine) : '✔'} <span style="font-size:11px;font-weight:400;color:var(--fg-muted)">${totalLabel}</span></span>
      </div>
    </div>
      `;
    })()}

    <div style="margin-top:8px">
      <a href="pagos.html" class="btn btn-primary" style="display:inline-block;text-decoration:none">
        + Registrar pago
      </a>
    </div>
  `;
}

window.setFam = (k) => { fam = k; render(); };

async function load() {
  try {
    const [banq, pagos] = await Promise.all([
      apiFetch('banquetera'),
      apiFetch('pagos'),
    ]);
    banqData  = banq && !banq.error ? banq : null;
    pagosData = pagos || [];
    render();
  } catch(e) {
    root.innerHTML = `<p style="color:var(--fg-muted);font-size:13px">Error al cargar datos.</p>`;
  }
}

// Render inicial con datos vacíos para que se vea algo rápido
render();
load();
</script>
</body>
</html>
