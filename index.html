<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel — Matrimonio 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="index.html">💍 Matrimonio 2026</a>
    <ul class="site-nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="gastos.html">Gastos</a></li>
      <li><a href="invitados.html">Invitados</a></li>
      <li><a href="pagos.html">Pagos</a></li>
    </ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
  </div>
</nav>

<main class="page">
  <h1 class="page-title">Panel general</h1>
  <p class="page-subtitle">Matrimonio Riedel Palma &amp; Solís Soto · 2026</p>
  <div id="root"></div>
</main>

<script type="module">
import { apiFetch, apiPost, fileToBase64, fmt, initTheme, highlightNav, toast } from './api.js';

initTheme();
highlightNav();

// ── Totales fijos (sin Banquetera — ésta viene de la API) ─────
// Suma de: Centro de Eventos, DJ, Fotógrafo, Videógrafo,
// Maquilladora, Comida extra, Pista de Baile, Ceremonia,
// Saxofonista, Flores, Extras  (todos × 1.19 IVA normal)
const FIXED = {
  r: { n: 12475784, b: 14846183 },
  c: { n:  6237892, b:  7423092 },
  s: { n:  6237892, b:  7423092 },
};

const root = document.getElementById('root');
let BRUTO = { r:0, c:0, s:0 };
let NETO  = { r:0, c:0, s:0 };
let BRUTO_TOTAL = 0, NETO_TOTAL = 0;

function familiaCard(k, label, bruto, neto, pagado, pend) {
  const pct = bruto > 0 ? Math.min(100, Math.round(pagado / bruto * 100)) : 0;
  return `<div class="stat-tile ${k}">
    <div class="label">${label}</div>
    <div class="value">$${fmt(bruto)}</div>
    <div class="sub" style="display:flex;flex-direction:column;gap:1px">
      <span>neto $${fmt(neto)}</span>
      <span>pagado $${fmt(pagado)} · pendiente $${fmt(pend)}</span>
    </div>
    <div class="progress-wrap"><div class="progress-track">
      <div class="progress-fill" style="width:${pct}%;background:var(--${k}-color)"></div>
    </div></div>
  </div>`;
}

function renderPagos(pagos) {
  if (!pagos || !pagos.length) {
    return '<p style="color:var(--fg-muted);font-size:13px;padding:8px 0">Aún no hay pagos. <a href="pagos.html" style="color:var(--accent-fg)">Registrar uno →</a></p>';
  }
  const todos = [...pagos].reverse();
  return `<div class="table-wrap"><table>
    <thead><tr><th>Fecha</th><th>Familia</th><th>Concepto</th><th class="num">Monto</th><th>Comprobante</th></tr></thead>
    <tbody>${todos.map(p => {
      const k = p.familia === 'Riedel Palma' ? 'r' : p.familia === 'Chico' ? 'c' : 's';
      const hasComp = p.comprobante && p.comprobante.startsWith('http');
      const comp = `
        <div style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">
          ${hasComp ? `<a href="${p.comprobante}" target="_blank" style="color:var(--accent-fg);font-size:12px">Ver →</a>` : ''}
          <label style="cursor:pointer;color:var(--accent-fg);font-size:12px;display:inline-flex;align-items:center;gap:3px">
            📎 ${hasComp ? 'Otro' : 'Adjuntar'}
            <input type="file" accept="image/*,application/pdf" hidden
              onchange="subirComp('${p.id}', this)">
          </label>
        </div>`;
      return `<tr>
        <td>${p.fecha}</td>
        <td><span class="badge badge-${k}">${p.familia}</span></td>
        <td>${p.concepto}</td>
        <td class="num">$${fmt(p.monto)}</td>
        <td id="comp-cell-${p.id}">${comp}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>
  <p style="text-align:right;margin-top:10px"><a href="pagos.html" style="color:var(--accent-fg);font-size:13px">Registrar pago →</a></p>`;
}

window.subirComp = async function(pagoId, input) {
  const file = input.files[0];
  if (!file) return;
  const cell = document.getElementById(`comp-cell-${pagoId}`);
  if (cell) cell.innerHTML = '<span style="font-size:12px;color:var(--fg-muted)">Subiendo…</span>';
  try {
    const b64 = await fileToBase64(file);
    const res = await apiPost({
      action:   'uploadComprobante',
      pagoId,
      fileData: b64,
      mimeType: file.type,
      fileName: file.name,
    });
    if (res.ok && res.url) {
      if (cell) cell.innerHTML = `
        <div style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">
          <a href="${res.url}" target="_blank" style="color:var(--accent-fg);font-size:12px">Ver →</a>
          <label style="cursor:pointer;color:var(--accent-fg);font-size:12px;display:inline-flex;align-items:center;gap:3px">
            📎 Otro
            <input type="file" accept="image/*,application/pdf" hidden
              onchange="subirComp('${pagoId}', this)">
          </label>
        </div>`;
      try { localStorage.removeItem(PAGOS_CACHE_KEY); } catch(e) {}
      toast('Comprobante subido ✓');
    } else {
      if (cell) cell.innerHTML = '<span style="color:#c0392b;font-size:12px">Error</span>';
      toast('Error al subir', false);
    }
  } catch(err) {
    if (cell) cell.innerHTML = '<span style="color:#c0392b;font-size:12px">Error</span>';
    toast(err.message || 'Error al subir', false);
  }
};

function renderPanel(pagos) {
  const pagado = { r: 0, c: 0, s: 0 };
  (pagos || []).forEach(p => {
    const k = p.familia === 'Riedel Palma' ? 'r' : p.familia === 'Chico' ? 'c' : 's';
    pagado[k] += Number(p.monto) || 0;
  });
  const pagadoTotal = pagado.r + pagado.c + pagado.s;

  const pend = {
    r: Math.max(0, BRUTO.r - pagado.r),
    c: Math.max(0, BRUTO.c - pagado.c),
    s: Math.max(0, BRUTO.s - pagado.s),
  };
  const pendTotal = pend.r + pend.c + pend.s;
  const pct = BRUTO_TOTAL > 0 ? Math.min(100, Math.round(pagadoTotal / BRUTO_TOTAL * 100)) : 0;

  root.innerHTML = `
    <div class="section-label">Totales generales</div>
    <div class="stat-grid" style="margin-bottom:28px">
      <div class="stat-tile t">
        <div class="label">Total bruto</div>
        <div class="value">$${fmt(BRUTO_TOTAL)}</div>
        <div class="sub">neto $${fmt(NETO_TOTAL)}</div>
      </div>
      <div class="stat-tile">
        <div class="label">Pagado</div>
        <div class="value">$${fmt(pagadoTotal)}</div>
        <div class="sub">${pct}% del total bruto</div>
        <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>
      </div>
      <div class="stat-tile">
        <div class="label">Por pagar</div>
        <div class="value">$${fmt(pendTotal)}</div>
        <div class="sub">entre las 3 familias</div>
      </div>
    </div>

    <div class="section-label">Por familia</div>
    <div class="stat-grid" style="margin-bottom:28px">
      ${familiaCard('r','Riedel Palma',BRUTO.r,NETO.r,pagado.r,pend.r)}
      ${familiaCard('c','Chico',BRUTO.c,NETO.c,pagado.c,pend.c)}
      ${familiaCard('s','Solís Soto',BRUTO.s,NETO.s,pagado.s,pend.s)}
    </div>

    <div class="section-label">Distribución gastos generales</div>
    <div class="card" style="margin-bottom:28px">
      <p style="font-size:13px;color:var(--fg-muted);margin:0 0 16px">
        Para ítems de uso común (DJ, Fotógrafo, Videógrafo, Flores, Pista de Baile, Saxofonista, Comida extra, Extras). La Banquetera se divide según los invitados de cada familia.
      </p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:110px;font-size:13px;font-weight:500;color:var(--r-color)">Riedel Palma</span>
          <div style="flex:1;background:var(--border);border-radius:99px;overflow:hidden;height:20px">
            <div style="width:50%;background:var(--r-color);height:100%;border-radius:99px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px">
              <span style="font-size:11px;font-weight:700;color:#fff">50%</span>
            </div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:110px;font-size:13px;font-weight:500;color:var(--c-color)">Chico</span>
          <div style="flex:1;background:var(--border);border-radius:99px;overflow:hidden;height:20px">
            <div style="width:25%;background:var(--c-color);height:100%;border-radius:99px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px">
              <span style="font-size:11px;font-weight:700;color:#fff">25%</span>
            </div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:110px;font-size:13px;font-weight:500;color:var(--s-color)">Solís Soto</span>
          <div style="flex:1;background:var(--border);border-radius:99px;overflow:hidden;height:20px">
            <div style="width:25%;background:var(--s-color);height:100%;border-radius:99px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px">
              <span style="font-size:11px;font-weight:700;color:#fff">25%</span>
            </div>
          </div>
        </div>
      </div>
      <p style="font-size:12px;color:var(--fg-faint);margin:14px 0 0">
        🍽️ <strong>Banquetera:</strong> distribución variable según invitados por familia · <a href="gastos.html" style="color:var(--accent-fg)">Ver detalle →</a>
      </p>
    </div>

    <div class="section-label">Pagos registrados</div>
    <div class="card" id="pagos-card">
      ${renderPagos(pagos)}
    </div>
  `;
}

const PAGOS_CACHE_KEY = 'panel_pagos_v1';
const BANQ_CACHE_KEY  = 'panel_banq_v1';

function getCached(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts < 10 * 60 * 1000) return data;
  } catch(e) {}
  return null;
}
function setCached(key, data) {
  try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
}

function applyBanq(banq) {
  if (!banq || banq.error) return;
  BRUTO = { r: FIXED.r.b + (banq.rb||0), c: FIXED.c.b + (banq.cb||0), s: FIXED.s.b + (banq.sb||0) };
  NETO  = { r: FIXED.r.n + (banq.rn||0), c: FIXED.c.n + (banq.cn||0), s: FIXED.s.n + (banq.sn||0) };
  BRUTO_TOTAL = BRUTO.r + BRUTO.c + BRUTO.s;
  NETO_TOTAL  = NETO.r  + NETO.c  + NETO.s;
}

async function render() {
  const cachedPagos = getCached(PAGOS_CACHE_KEY);
  const cachedBanq  = getCached(BANQ_CACHE_KEY);

  // Render inmediato con lo que hay en caché
  BRUTO = { r: FIXED.r.b, c: FIXED.c.b, s: FIXED.s.b };
  NETO  = { r: FIXED.r.n, c: FIXED.c.n, s: FIXED.s.n };
  BRUTO_TOTAL = BRUTO.r + BRUTO.c + BRUTO.s;
  NETO_TOTAL  = NETO.r  + NETO.c  + NETO.s;
  applyBanq(cachedBanq);           // totales completos si ya tenemos banquetera cacheada
  renderPanel(cachedPagos || []);

  // Actualizar desde la API en segundo plano
  try {
    const [banq, pagos] = await Promise.all([
      apiFetch('banquetera'),
      apiFetch('pagos'),
    ]);
    if (banq && !banq.error) {
      setCached(BANQ_CACHE_KEY, banq);
      applyBanq(banq);
    }
    const data = pagos || [];
    setCached(PAGOS_CACHE_KEY, data);
    renderPanel(data);
  } catch(e) {
    if (!cachedPagos) {
      const card = document.getElementById('pagos-card');
      if (card) card.innerHTML = `<p style="color:var(--fg-muted);font-size:13px;padding:8px 0">
        No se pudieron cargar los pagos. <a href="pagos.html" style="color:var(--accent-fg)">Ir a pagos →</a>
      </p>`;
    }
  }
}

render();
</script>
</body>
</html>
