<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel — Matrimonio 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="index.html">💍 Matrimonio 2026</a>
    <ul class="site-nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="gastos.html">Gastos</a></li>
      <li><a href="invitados.html">Invitados</a></li>
      <li><a href="pagos.html">Pagos</a></li>
    </ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
  </div>
</nav>

<main class="page">
  <h1 class="page-title">Panel general</h1>
  <p class="page-subtitle" id="subtitle">Cargando datos…</p>

  <div id="root"><div class="loading"><div class="spinner"></div> Cargando…</div></div>
</main>

<script type="module">
import { apiFetch, fmt, initTheme, highlightNav, showError, FAMILIA } from './api.js';

initTheme();
highlightNav();

const root = document.getElementById('root');

async function render() {
  try {
    const { gastos: d, pagos } = await apiFetch('all');
    const t = d.totals;

    // Pagado por familia desde Pagos tab
    const pagado = { r: 0, c: 0, s: 0 };
    (pagos || []).forEach(p => {
      const k = p.familia === 'Riedel Palma' ? 'r' : p.familia === 'Chico' ? 'c' : 's';
      pagado[k] += Number(p.monto) || 0;
    });
    pagado.t = pagado.r + pagado.c + pagado.s;

    const pendiente = {
      r: Math.max(0, t.rn - pagado.r),
      c: Math.max(0, t.cn - pagado.c),
      s: Math.max(0, t.sn - pagado.s),
    };

    document.getElementById('subtitle').textContent =
      `Total bruto $${fmt(t.tb)} · neto $${fmt(t.tn)} · pagado $${fmt(pagado.t)}`;

    root.innerHTML = `
      <!-- Totales -->
      <div class="section-label">Totales generales</div>
      <div class="stat-grid" style="margin-bottom:28px">
        <div class="stat-tile t">
          <div class="label">Total bruto</div>
          <div class="value">$${fmt(t.tb)}</div>
          <div class="sub">con IVA</div>
        </div>
        <div class="stat-tile t">
          <div class="label">Total neto</div>
          <div class="value">$${fmt(t.tn)}</div>
          <div class="sub">sin IVA</div>
        </div>
        <div class="stat-tile">
          <div class="label">Pagado</div>
          <div class="value">$${fmt(pagado.t)}</div>
          <div class="sub">${Math.round(pagado.t / t.tn * 100)}% del neto</div>
          <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,pagado.t/t.tn*100)}%"></div></div></div>
        </div>
        <div class="stat-tile">
          <div class="label">Por pagar (neto)</div>
          <div class="value">$${fmt(pendiente.r + pendiente.c + pendiente.s)}</div>
          <div class="sub">entre las 3 familias</div>
        </div>
      </div>

      <!-- Por familia -->
      <div class="section-label">Resumen por familia</div>
      <div class="stat-grid" style="margin-bottom:28px">
        ${familiaCard('r','Riedel Palma',t.rn,pagado.r,pendiente.r)}
        ${familiaCard('c','Chico',t.cn,pagado.c,pendiente.c)}
        ${familiaCard('s','Solís Soto',t.sn,pagado.s,pendiente.s)}
      </div>

      <!-- Últimos pagos -->
      <div class="section-label">Últimos pagos registrados</div>
      <div class="card">
        ${renderPagos(pagos)}
      </div>
    `;
  } catch(e) {
    showError(root, `No se pudo cargar: ${e.message}`);
  }
}

function familiaCard(key, label, total, pagado, pendiente) {
  const pct = Math.min(100, Math.round(pagado / total * 100));
  return `<div class="stat-tile ${key}">
    <div class="label">${label}</div>
    <div class="value">$${fmt(total)}</div>
    <div class="sub">pagado $${fmt(pagado)} · pendiente $${fmt(pendiente)}</div>
    <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:var(--${key}-color)"></div></div></div>
  </div>`;
}

function renderPagos(pagos) {
  if (!pagos || !pagos.length) return '<p style="color:var(--fg-muted);font-size:13px;padding:8px 0">Aún no hay pagos registrados. <a href="pagos.html" style="color:var(--accent-fg)">Registrar uno →</a></p>';
  const recientes = [...pagos].reverse().slice(0, 6);
  return `<div class="table-wrap"><table>
    <thead><tr><th>Fecha</th><th>Familia</th><th>Concepto</th><th class="num">Monto</th><th>Comprobante</th></tr></thead>
    <tbody>
      ${recientes.map(p => `<tr>
        <td>${p.fecha}</td>
        <td><span class="badge badge-${p.familia==='Riedel Palma'?'r':p.familia==='Chico'?'c':'s'}">${p.familia}</span></td>
        <td>${p.concepto}</td>
        <td class="num">$${fmt(p.monto)}</td>
        <td>${p.comprobante ? `<a href="${p.comprobante}" target="_blank" style="color:var(--accent-fg);font-size:12px">Ver →</a>` : '—'}</td>
      </tr>`).join('')}
    </tbody>
  </table></div>
  <p style="text-align:right;margin-top:10px"><a href="pagos.html" style="color:var(--accent-fg);font-size:13px">Ver todos los pagos →</a></p>`;
}

render();
</script>
</body>
</html>
