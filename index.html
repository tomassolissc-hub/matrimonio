<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel — Matrimonio 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="index.html">💍 Matrimonio 2026</a>
    <ul class="site-nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="gastos.html">Gastos</a></li>
      <li><a href="invitados.html">Invitados</a></li>
      <li><a href="pagos.html">Pagos</a></li>
    </ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
  </div>
</nav>

<main class="page">
  <h1 class="page-title">Panel general</h1>
  <p class="page-subtitle" id="subtitle">Matrimonio Riedel Palma &amp; Solís Soto · 2026</p>
  <div id="root"><div class="loading"><div class="spinner"></div> Cargando…</div></div>
</main>

<script type="module">
import { apiFetch, fmt, initTheme, highlightNav, showError } from './api.js';

initTheme();
highlightNav();

// ── Datos financieros (actualizados manualmente cuando cambia un contrato) ──
const NETO = { r: 27352541, c: 11760340, s: 9207063 };
const NETO_TOTAL = NETO.r + NETO.c + NETO.s; // 48319944

const root = document.getElementById('root');

async function render() {
  try {
    const pagos = await apiFetch('pagos');

    const pagado = { r: 0, c: 0, s: 0 };
    (pagos || []).forEach(p => {
      const fam = p.familia;
      const k = fam === 'Riedel Palma' ? 'r' : fam === 'Chico' ? 'c' : 's';
      pagado[k] += Number(p.monto) || 0;
    });
    const pagadoTotal = pagado.r + pagado.c + pagado.s;

    const pend = {
      r: Math.max(0, NETO.r - pagado.r),
      c: Math.max(0, NETO.c - pagado.c),
      s: Math.max(0, NETO.s - pagado.s),
    };
    const pendTotal = pend.r + pend.c + pend.s;
    const pct = Math.min(100, Math.round(pagadoTotal / NETO_TOTAL * 100));

    root.innerHTML = `
      <div class="section-label">Totales generales</div>
      <div class="stat-grid" style="margin-bottom:28px">
        <div class="stat-tile t">
          <div class="label">Total neto</div>
          <div class="value">$${fmt(NETO_TOTAL)}</div>
          <div class="sub">sin IVA</div>
        </div>
        <div class="stat-tile">
          <div class="label">Pagado</div>
          <div class="value">$${fmt(pagadoTotal)}</div>
          <div class="sub">${pct}% del total</div>
          <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>
        </div>
        <div class="stat-tile">
          <div class="label">Por pagar</div>
          <div class="value">$${fmt(pendTotal)}</div>
          <div class="sub">entre las 3 familias</div>
        </div>
      </div>

      <div class="section-label">Por familia</div>
      <div class="stat-grid" style="margin-bottom:28px">
        ${familiaCard('r','Riedel Palma',NETO.r,pagado.r,pend.r)}
        ${familiaCard('c','Chico',NETO.c,pagado.c,pend.c)}
        ${familiaCard('s','Solís Soto',NETO.s,pagado.s,pend.s)}
      </div>

      <div class="section-label">Últimos pagos</div>
      <div class="card">
        ${renderPagos(pagos)}
      </div>
    `;
  } catch(e) {
    showError(root, `No se pudo cargar: ${e.message}`);
  }
}

function familiaCard(k, label, total, pagado, pend) {
  const pct = Math.min(100, Math.round(pagado / total * 100));
  return `<div class="stat-tile ${k}">
    <div class="label">${label}</div>
    <div class="value">$${fmt(total)}</div>
    <div class="sub">pagado $${fmt(pagado)} · pendiente $${fmt(pend)}</div>
    <div class="progress-wrap"><div class="progress-track">
      <div class="progress-fill" style="width:${pct}%;background:var(--${k}-color)"></div>
    </div></div>
  </div>`;
}

function renderPagos(pagos) {
  if (!pagos || !pagos.length) {
    return '<p style="color:var(--fg-muted);font-size:13px;padding:8px 0">Aún no hay pagos. <a href="pagos.html" style="color:var(--accent-fg)">Registrar uno →</a></p>';
  }
  const recientes = [...pagos].reverse().slice(0, 6);
  return `<div class="table-wrap"><table>
    <thead><tr><th>Fecha</th><th>Familia</th><th>Concepto</th><th class="num">Monto</th><th>Comprobante</th></tr></thead>
    <tbody>${recientes.map(p => {
      const k = p.familia === 'Riedel Palma' ? 'r' : p.familia === 'Chico' ? 'c' : 's';
      return `<tr>
        <td>${p.fecha}</td>
        <td><span class="badge badge-${k}">${p.familia}</span></td>
        <td>${p.concepto}</td>
        <td class="num">$${fmt(p.monto)}</td>
        <td>${p.comprobante ? `<a href="${p.comprobante}" target="_blank" style="color:var(--accent-fg);font-size:12px">Ver →</a>` : '—'}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>
  <p style="text-align:right;margin-top:10px"><a href="pagos.html" style="color:var(--accent-fg);font-size:13px">Ver todos →</a></p>`;
}

render();
</script>
</body>
</html>
