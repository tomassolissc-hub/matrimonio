<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesas — Matrimonio 2026</title>
<link rel="stylesheet" href="style.css">
<style>
/* ── Floor plan ───────────────────────────────────────────── */
.page { max-width: none !important; }
.floor-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  margin-bottom: 20px;
}
.floor-svg {
  display: block;
  min-width: 900px;
  width: 100%;
  height: auto;
}

/* ── Table circles ────────────────────────────────────────── */
.t-circle {
  cursor: pointer;
  transition: filter .15s;
}
.t-circle:hover { filter: brightness(.88); }
.t-ring {
  fill: none;
  stroke-width: 1.5;
  opacity: .35;
}
.t-fill-empty   { fill: var(--border, #ddd); }
.t-fill-partial { fill: #e8a44a; }
.t-fill-full    { fill: #3a9e6e; }
.t-fill-novios  { fill: var(--accent-fg, #b59a6a); }

.t-label {
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  fill: var(--fg, #222);
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  user-select: none;
}
.t-label-dark { fill: #fff; }

/* ── Fixed elements (barra, pista…) ──────────────────────── */
.room-label {
  font-family: inherit;
  font-size: 10px;
  fill: var(--fg-muted, #888);
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  user-select: none;
}
.room-box {
  fill: var(--border, #ddd);
  stroke: var(--fg-faint, #ccc);
  stroke-width: 1;
  rx: 4;
}
.room-box-dark {
  fill: #c8b99a22;
  stroke: var(--accent-fg, #b59a6a);
  stroke-width: 1.5;
}

/* ── Tooltip ──────────────────────────────────────────────── */
#mesa-tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--card-bg, #fff);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,.15);
  padding: 10px 14px;
  min-width: 160px;
  max-width: 220px;
  font-size: 13px;
  z-index: 200;
  display: none;
  transition: opacity .1s;
}
#mesa-tooltip strong {
  display: block;
  font-size: 13px;
  margin-bottom: 6px;
  color: var(--fg);
}
#mesa-tooltip .tt-capacity {
  font-size: 11px;
  color: var(--fg-muted);
  margin-bottom: 6px;
}
#mesa-tooltip .tt-guest {
  font-size: 12px;
  color: var(--fg);
  padding: 2px 0;
  border-top: 1px solid var(--border);
}
#mesa-tooltip .tt-empty {
  font-size: 12px;
  color: var(--fg-faint);
  font-style: italic;
}

/* ── Side panel ───────────────────────────────────────────── */
#mesa-panel {
  position: fixed;
  top: 0; right: 0;
  width: min(380px, 100vw);
  height: 100%;
  background: #fff;
  border-left: 1px solid #ddd;
  box-shadow: -4px 0 24px rgba(0,0,0,.12);
  z-index: 500;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .25s ease;
}
#mesa-panel.open { transform: translateX(0); }
#panel-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.82);
  z-index: 499;
  display: none;
}
#panel-overlay.open { display: block; }

.panel-header {
  padding: 20px 20px 14px;
  border-bottom: 1px solid #eee;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.panel-title { font-size: 17px; font-weight: 700; margin: 0; color: #222; }
.panel-capacity {
  font-size: 12px;
  color: #888;
  margin-top: 2px;
}
.panel-close {
  background: none; border: none; cursor: pointer;
  color: #888; font-size: 22px; line-height: 1; padding: 0;
  flex-shrink: 0;
}

.panel-body { flex: 1; overflow-y: hidden; padding: 16px 20px; display: flex; flex-direction: column; }
.panel-body .assigned-list { flex-shrink: 0; }
.panel-body > div:last-child { flex: 1; display: flex; flex-direction: column; min-height: 0; }

.panel-section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: #999;
  margin: 0 0 8px;
}

.assigned-list { margin-bottom: 20px; }
.assigned-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
  font-size: 13px;
  color: #222;
  gap: 8px;
}
.assigned-item:last-child { border-bottom: none; }
.assigned-item .guest-name-text { flex: 1; }
.btn-remove-guest {
  background: none; border: none; cursor: pointer;
  color: var(--fg-faint); font-size: 16px; line-height: 1;
  padding: 0 2px; flex-shrink: 0;
  transition: color .15s;
}
.btn-remove-guest:hover { color: #e55; }

.search-available {
  width: 100%;
  box-sizing: border-box;
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #f7f7f7;
  color: #222;
  font-size: 13px;
  margin-bottom: 10px;
}
.available-list { flex: 1; overflow-y: auto; }

/* ── Checkbox guest list ──────────────────────────────────── */
.guest-check-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 6px 9px 2px;
  border-bottom: 1px solid #eee;
  font-size: 13px;
  color: #222;
  cursor: pointer;
  user-select: none;
  transition: background .1s;
  border-radius: 4px;
}
.guest-check-item:last-child { border-bottom: none; }
.guest-check-item:hover { background: #f5f5f5; }
.guest-check-item input[type="checkbox"] {
  width: 16px; height: 16px; flex-shrink: 0;
  cursor: pointer; accent-color: #3a9e6e;
}
.guest-check-name { flex: 1; }
.guest-other-mesa {
  font-size: 10px;
  color: #aaa;
  background: #f0f0f0;
  border-radius: 4px;
  padding: 2px 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.guest-check-item.in-other {
  opacity: .5;
  cursor: default;
}
.guest-check-item.is-full {
  opacity: .45;
  cursor: not-allowed;
}

/* ── Legend ───────────────────────────────────────────────── */
.legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  font-size: 12px;
  color: var(--fg-muted);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot {
  width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
}
</style>
</head>

<main class="page">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px">
    <div>
      <h1 class="page-title" style="margin-bottom:2px">Plano de mesas</h1>
      <p class="page-subtitle" id="subtitle" style="margin:0">Cargando…</p>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--border)"></div> Sin asignar</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e8a44a"></div> Parcial</div>
    <div class="legend-item"><div class="legend-dot" style="background:#3a9e6e"></div> Completa</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-fg,#b59a6a)"></div> Novios</div>
  </div>

  <div class="floor-wrap">
    <svg id="floor-svg" class="floor-svg" viewBox="0 0 1020 510" xmlns="http://www.w3.org/2000/svg">
      <!-- Room outline -->
      <rect x="1" y="1" width="1018" height="508" rx="6" fill="none" stroke="var(--border)" stroke-width="1.5"/>

      <line x1="430" y1="494" x2="430" y2="510" stroke="var(--border)" stroke-width="1"/>
      <line x1="530" y1="494" x2="530" y2="510" stroke="var(--border)" stroke-width="1"/>

      <!-- Top labels -->
      <text x="330" y="16" class="room-label">Salida cocina</text>
      <text x="620" y="16" class="room-label">Salida cocina</text>

      <line x1="290" y1="1" x2="290" y2="28" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="580" y1="1" x2="580" y2="28" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="870" y1="1" x2="870" y2="28" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>

      <rect x="985" y="300" width="30" height="148" rx="5" class="room-box"/>

      <rect x="630" y="250" width="100" height="32" rx="5" class="room-box-dark" fill="none" stroke="var(--border)" stroke-width="1.2"/>
      <text x="680" y="267" class="room-label" style="font-size:10px;fill:var(--fg-muted)">Postres</text>

      <!-- Decoración -->

      <!-- Mesa Novios (clickable) -->

        <rect x="455" y="244" width="150" height="44" rx="6" fill="var(--accent-fg,#b59a6a)" opacity=".85"/>

        <!-- chairs top -->
        <rect x="466" y="238" width="12" height="8" rx="2" fill="var(--border)" opacity=".7"/>
        <rect x="484" y="238" width="12" height="8" rx="2" fill="var(--border)" opacity=".7"/>
        <rect x="502" y="238" width="12" height="8" rx="2" fill="var(--border)" opacity=".7"/>
        <rect x="520" y="238" width="12" height="8" rx="2" fill="var(--border)" opacity=".7"/>
        <rect x="538" y="238" width="12" height="8" rx="2" fill="var(--border)" opacity=".7"/>
        <rect x="556" y="238" width="12" height="8" rx="2" fill="var(--border)" opacity=".7"/>
        <!-- chairs bottom -->
        <rect x="466" y="286" width="12" height="8" rx="2" fill="var(--border)" opacity=".7"/>
        <rect x="484" y="286" width="12" height="8" rx="2" fill="var(--border)" opacity=".7"/>
        <rect x="502" y="286" width="12" height="8" rx="2" fill="var(--border)" opacity=".7"/>
        <rect x="520" y="286" width="12" height="8" rx="2" fill="var(--border)" opacity=".7"/>
        <rect x="538" y="286" width="12" height="8" rx="2" fill="var(--border)" opacity=".7"/>

        <text x="530" y="268" class="t-label t-label-dark" style="font-size:12px">Novios</text>

      <!-- Round tables — rendered by JS -->

    </svg>
  </div>
</main>

<!-- Tooltip -->
<div id="mesa-tooltip"></div>

<!-- Panel overlay -->
<div id="panel-overlay" onclick="closePanel()"></div>

<!-- Side panel -->
<div id="mesa-panel">
  <div class="panel-header">
    <div>
      <div class="panel-title" id="panel-title">Mesa —</div>
      <div class="panel-capacity" id="panel-capacity"></div>

    <button class="panel-close" onclick="closePanel()">×</button>

  <div class="panel-body">

             placeholder="Buscar por nombre…" autocomplete="off" oninput="renderAllGuests()">

<script type="module">
import { apiFetch, apiPost, initTheme, highlightNav, toast } from './api.js';

initTheme();
highlightNav();

// ── Layout de mesas (número → {cx, cy}) ──────────────────────
// Viewbox 1020×510. Tables start at x≈250. Rows y: 130, 200, 266, 335, 435
const TABLE_R = 28; // radio círculo

const ROWS = [
  // [número, cx, cy]
  // Top row
  ['27',270,112],['28',340,112],['29',410,112],['30',480,112],
  ['31',550,112],['32',620,112],['33',700,112],['34',770,112],['35',840,112],
  // Row 4
  ['19',270,188],['20',340,188],['21',410,188],['22',480,188],
  ['23',550,188],['24',620,188],['25',700,188],['26',770,188],
  // Center right
  ['18',910,266],
  // Row 2
  ['10',270,345],['11',340,345],['12',410,345],['13',480,345],
  ['14',550,345],['15',620,345],['16',700,345],['17',770,345],
  // Bottom row
  ['01',270,440],['02',340,440],['03',410,440],
  // gap decoración ~x=490
  ['04',580,440],['05',650,440],['06',720,440],['07',790,440],['08',860,440],['09',930,440],
];

const MAX_CAP = 10;
const NOVIOS_CAP = 12;

// Set de nombres de mesa válidos — para ignorar valores espurios en g.mesa
// (se define aquí para que esté disponible en buildMesaMap, updateSubtitle y renderAllGuests)
const VALID_MESAS = new Set(['Novios', ...ROWS.map(([n]) => 'Mesa ' + n)]);

// ── Estado ────────────────────────────────────────────────────
let allGuests = [];   // [{id, n, mesa}]  — lista plana
let mesaMap   = {};   // { 'Mesa 12': [guest, ...] }
let activeMesa = null;

// ── Cargar datos ──────────────────────────────────────────────
async function load() {
  try {
    // Usamos 'mesas' — endpoint liviano ({id, n, mesa}), caché independiente
    // No toca guests_v3, así invitados.html no se ve afectado
    const data = await apiFetch('mesas');
    allGuests = data.guests || [];
    buildMesaMap();
    renderAllTables();
    updateSubtitle();
  } catch(e) {
    document.getElementById('subtitle').textContent = 'Error: ' + e.message;
  }
}

function buildMesaMap() {
  mesaMap = { 'Novios': [] };
  ROWS.forEach(([n]) => { mesaMap['Mesa ' + n] = []; });
  allGuests.forEach(g => {
    // Solo mesas válidas — ignora "Enviado", "No enviado" u otros valores espurios
    if (g.mesa && VALID_MESAS.has(g.mesa) && mesaMap[g.mesa] !== undefined) {
      mesaMap[g.mesa].push(g);
    }
  });
}

function updateSubtitle() {
  // Solo cuenta asignaciones a mesas reales (ignora valores espurios como "Enviado")
  const asignados = allGuests.filter(g => VALID_MESAS && VALID_MESAS.has(g.mesa)).length;
  const total = allGuests.length;
  document.getElementById('subtitle').textContent =
    `${asignados} de ${total} invitados asignados a mesa`;
}

// ── Renderizar círculos de mesas ──────────────────────────────
function tableColor(nombre) {
  if (nombre === 'Novios') return 'var(--accent-fg,#b59a6a)';
  const cap  = nombre === 'Novios' ? NOVIOS_CAP : MAX_CAP;
  const cnt  = (mesaMap[nombre] || []).length;
  if (cnt === 0)   return 'var(--border,#ddd)';
  if (cnt >= cap)  return '#3a9e6e';
  return '#e8a44a';
}

function labelColor(nombre) {
  const cap = nombre === 'Novios' ? NOVIOS_CAP : MAX_CAP;
  const cnt = (mesaMap[nombre] || []).length;
  return (cnt > 0) ? '#fff' : 'var(--fg,#222)';
}

function renderAllTables() {
  const g = document.getElementById('tables-group');
  g.innerHTML = ROWS.map(([num, cx, cy]) => {
    const nombre = 'Mesa ' + num;
    const color  = tableColor(nombre);
    const lcolor = labelColor(nombre);
    const cnt    = (mesaMap[nombre] || []).length;
    return `
      <g class="t-circle" id="t-${num}" data-mesa="${nombre}"
         onclick="openPanel('${nombre}')"
         onmouseenter="showTooltip(event,'${nombre}')"
         onmouseleave="hideTooltip()">
        <circle cx="${cx}" cy="${cy}" r="${TABLE_R + 8}" class="t-ring" stroke="${color}"/>
        <circle cx="${cx}" cy="${cy}" r="${TABLE_R}" fill="${color}"/>
        <text x="${cx}" y="${cy - 5}" class="t-label" style="fill:${lcolor};font-size:9px">${num}</text>
        ${cnt > 0 ? `<text x="${cx}" y="${cy + 8}" class="t-label" style="fill:${lcolor};font-size:10px;font-weight:600">${cnt}/${MAX_CAP}</text>` : ''}
      </g>`;
  }).join('');

  // Novios hover
  const novEl = document.getElementById('mesa-Novios');
  if (novEl) {
    novEl.addEventListener('mouseenter', e => showTooltip(e, 'Novios'));
    novEl.addEventListener('mouseleave', hideTooltip);
  }
}

function refreshTable(nombre) {
  if (nombre === 'Novios') return; // handled separately
  const num   = nombre.replace('Mesa ', '');
  const row   = ROWS.find(r => r[0] === num);
  if (!row) return;
  const [,cx, cy] = row;
  const el    = document.getElementById('t-' + num);
  if (!el) return;
  const color  = tableColor(nombre);
  const lcolor = labelColor(nombre);
  const cnt    = (mesaMap[nombre] || []).length;
  el.innerHTML = `
    <circle cx="${cx}" cy="${cy}" r="${TABLE_R + 8}" class="t-ring" stroke="${color}"/>
    <circle cx="${cx}" cy="${cy}" r="${TABLE_R}" fill="${color}"/>
    <text x="${cx}" y="${cy - 5}" class="t-label" style="fill:${lcolor};font-size:9px">${num}</text>
    ${cnt > 0 ? `<text x="${cx}" y="${cy + 8}" class="t-label" style="fill:${lcolor};font-size:10px;font-weight:600">${cnt}/${MAX_CAP}</text>` : ''}`;
}

// ── Tooltip ───────────────────────────────────────────────────
const tooltip = document.getElementById('mesa-tooltip');

window.showTooltip = function(e, nombre) {
  const cap    = nombre === 'Novios' ? NOVIOS_CAP : MAX_CAP;
  const guests = mesaMap[nombre] || [];
  const cnt    = guests.length;

  tooltip.innerHTML = `
    <strong>${nombre}</strong>
    <div class="tt-capacity">${cnt}/${cap} personas</div>
    ${guests.length
      ? guests.map(g => `<div class="tt-guest">${g.n}</div>`).join('')
      : '<div class="tt-empty">Sin invitados asignados</div>'}`;

  tooltip.style.display = 'block';
  posTooltip(e);
};

function posTooltip(e) {
  const x = e.clientX + 14;
  const y = e.clientY - 10;
  const w = tooltip.offsetWidth;
  const h = tooltip.offsetHeight;
  tooltip.style.left = (x + w > window.innerWidth  ? e.clientX - w - 14 : x) + 'px';
  tooltip.style.top  = (y + h > window.innerHeight ? e.clientY - h      : y) + 'px';
}

window.hideTooltip = function() {
  tooltip.style.display = 'none';
};

// ── Panel lateral ─────────────────────────────────────────────
const panel    = document.getElementById('mesa-panel');
const overlay  = document.getElementById('panel-overlay');

window.openPanel = function(nombre) {
  hideTooltip();
  activeMesa = nombre;
  const cap  = nombre === 'Novios' ? NOVIOS_CAP : MAX_CAP;
  const cnt  = (mesaMap[nombre] || []).length;
  document.getElementById('panel-title').textContent    = nombre;
  document.getElementById('panel-capacity').textContent = `${cnt}/${cap} personas`;
  document.getElementById('panel-search').value = '';
  renderAssigned();
  renderAllGuests();
  panel.classList.add('open');
  overlay.classList.add('open');
};

window.closePanel = function() {
  panel.classList.remove('open');
  overlay.classList.remove('open');
  activeMesa = null;
};

function renderAssigned() {
  const el     = document.getElementById('panel-assigned');
  const guests = mesaMap[activeMesa] || [];
  if (!guests.length) {
    el.innerHTML = '<p style="font-size:13px;color:var(--fg-faint);margin:0">Sin invitados aún.</p>';
    return;
  }
  el.innerHTML = guests.map(g => `
    <div class="assigned-item">
      <span class="guest-name-text">${g.n}</span>
      <button class="btn-remove-guest" onclick="removeGuest('${g.id}')" title="Quitar de esta mesa">×</button>
    </div>`).join('');
}

// Renderiza la lista completa — solo al abrir panel o al cambiar búsqueda
window.renderAllGuests = function() {
  const q      = document.getElementById('panel-search').value.trim().toLowerCase();
  const cap    = activeMesa === 'Novios' ? NOVIOS_CAP : MAX_CAP;
  const inThis = new Set((mesaMap[activeMesa] || []).map(g => String(g.id)));
  const isFull = inThis.size >= cap;
  const el     = document.getElementById('panel-all-guests');

  // Solo invitados full (sin acompañantes "(A)")
  let list = allGuests.filter(g => !g.n.includes('(A)'));
  if (q) list = list.filter(g => g.n.toLowerCase().includes(q));

  if (!list.length) {
    el.innerHTML = '<p style="font-size:12px;color:#aaa;margin:4px 0;font-style:italic">Sin resultados.</p>';
    return;
  }

  // Orden estable: asignados a esta mesa primero, luego libres, luego con otra mesa — y alfabético dentro de cada grupo
  list = [...list].sort((a, b) => {
    const aIn   = inThis.has(String(a.id));
    const bIn   = inThis.has(String(b.id));
    const aMesa = VALID_MESAS.has(a.mesa) ? a.mesa : '';
    const bMesa = VALID_MESAS.has(b.mesa) ? b.mesa : '';
    if (aIn && !bIn)     return -1;
    if (!aIn && bIn)     return 1;
    if (!aMesa && bMesa) return -1;
    if (aMesa && !bMesa) return 1;
    return a.n.localeCompare(b.n, 'es');
  });

  el.innerHTML = list.map(g => {
    const gid     = String(g.id);
    const checked = inThis.has(gid);
    const mesaVal = VALID_MESAS.has(g.mesa) ? g.mesa : '';
    const inOther = !checked && mesaVal !== '';
    const disabled = inOther || (!checked && isFull);
    const cls     = `guest-check-item${inOther ? ' in-other' : ''}${!inOther && !checked && isFull ? ' is-full' : ''}`;

    return `<label class="${cls}">
      <input type="checkbox" data-gid="${gid}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}
        onclick="event.preventDefault();event.stopPropagation();if(!this.disabled)toggleGuest('${gid}')">
      <span class="guest-check-name">${g.n}</span>
      ${inOther ? `<span class="guest-other-mesa">${mesaVal}</span>` : ''}
    </label>`;
  }).join('');
};

// Actualiza solo los checkboxes en el DOM existente — sin re-renderizar la lista
function patchGuestCheckboxes() {
  const cap    = activeMesa === 'Novios' ? NOVIOS_CAP : MAX_CAP;
  const inThis = new Set((mesaMap[activeMesa] || []).map(g => String(g.id)));
  const isFull = inThis.size >= cap;

  document.querySelectorAll('#panel-all-guests input[data-gid]').forEach(cb => {
    const gid     = cb.dataset.gid;
    const g       = allGuests.find(x => String(x.id) === gid);
    if (!g) return;
    const checked = inThis.has(gid);
    const mesaVal = VALID_MESAS.has(g.mesa) ? g.mesa : '';
    const inOther = !checked && mesaVal !== '';
    const disabled = inOther || (!checked && isFull);
    const label   = cb.closest('.guest-check-item');

    cb.checked  = checked;
    cb.disabled = disabled;
    if (label) {
      label.classList.toggle('in-other', inOther);
      label.classList.toggle('is-full', !inOther && !checked && isFull);
    }
  });
}

// ── Helpers de render del panel ───────────────────────────────
function syncPanelCapacity() {
  const cap = activeMesa === 'Novios' ? NOVIOS_CAP : MAX_CAP;
  const cnt = (mesaMap[activeMesa] || []).length;
  document.getElementById('panel-capacity').textContent = `${cnt}/${cap} personas`;
}

function refreshPanel() {
  syncPanelCapacity();
  renderAssigned();
  patchGuestCheckboxes(); // solo actualiza los checks, no re-renderiza la lista
  refreshTable(activeMesa);
  updateSubtitle();
}

// ── Toggle: marcar/desmarcar invitado con checkbox ────────────
window.toggleGuest = async function(id) {
  const g = allGuests.find(x => String(x.id) === String(id));
  if (!g) return;
  if (g.mesa === activeMesa) {
    await removeGuest(id);
  } else {
    await addGuest(id);
  }
};

// ── Asignar ───────────────────────────────────────────────────
window.addGuest = async function(id) {
  const g = allGuests.find(x => String(x.id) === String(id));
  if (!g) return;

  const cap = activeMesa === 'Novios' ? NOVIOS_CAP : MAX_CAP;
  if ((mesaMap[activeMesa] || []).length >= cap) {
    toast('Mesa completa', false); return;
  }

  // Optimistic update
  g.mesa = activeMesa;
  mesaMap[activeMesa] = mesaMap[activeMesa] || [];
  mesaMap[activeMesa].push(g);
  refreshPanel();

  try {
    await apiPost({ action: 'asignarMesa', guestId: id, mesa: activeMesa });
    toast(`${g.n} asignado a ${activeMesa}`);
  } catch(e) {
    g.mesa = '';
    mesaMap[activeMesa] = mesaMap[activeMesa].filter(x => String(x.id) !== String(id));
    refreshPanel();
    toast('Error: ' + e.message, false);
  }
};

// ── Quitar ────────────────────────────────────────────────────
window.removeGuest = async function(id) {
  const g = allGuests.find(x => String(x.id) === String(id));
  if (!g) return;

  const prevMesa = g.mesa;

  // Optimistic update
  g.mesa = '';
  mesaMap[activeMesa] = (mesaMap[activeMesa] || []).filter(x => String(x.id) !== String(id));
  refreshPanel();

  try {
    await apiPost({ action: 'desasignarMesa', guestId: id });
    toast(`${g.n} quitado de ${prevMesa}`);
  } catch(e) {
    g.mesa = prevMesa;
    mesaMap[activeMesa].push(g);
    refreshPanel();
    toast('Error: ' + e.message, false);
  }
};

load();
</script>
