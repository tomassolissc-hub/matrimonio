<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagos — Matrimonio 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="index.html">💍 Matrimonio 2026</a>
    <ul class="site-nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="gastos.html">Gastos</a></li>
      <li><a href="invitados.html">Invitados</a></li>
      <li><a href="pagos.html">Pagos</a></li>
      <li><a href="familia.html">Mi resumen</a></li>
    </ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
  </div>
</nav>

<main class="page">
  <h1 class="page-title">Pagos y comprobantes</h1>
  <p class="page-subtitle">Registra pagos y sube los comprobantes de transferencia</p>

  <!-- Modal editar pago -->
  <div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;padding:20px">
    <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <span style="font-weight:600;font-size:15px">Editar pago</span>
        <button onclick="cerrarModal()" style="background:none;border:none;cursor:pointer;color:var(--fg-muted);font-size:20px;line-height:1">×</button>
      </div>
      <input type="hidden" id="edit-id">
      <div class="form-group" style="margin-bottom:12px">
        <label class="form-label">Familia</label>
        <select class="form-select" id="edit-familia">
          <option value="Riedel Palma">Riedel Palma</option>
          <option value="Chico">Chico</option>
          <option value="Solís Soto">Solís Soto</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:12px">
        <label class="form-label">Concepto</label>
        <input class="form-input" id="edit-concepto" type="text">
      </div>
      <div class="form-group" style="margin-bottom:18px">
        <label class="form-label">Monto ($)</label>
        <input class="form-input" id="edit-monto" type="number" min="0">
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn" onclick="cerrarModal()" style="flex:1">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarEdicion()" style="flex:1">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Formulario nuevo pago -->
  <div class="card" style="margin-bottom:20px">
    <div class="section-label">Registrar pago</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Familia</label>
        <select class="form-select" id="f-familia">
          <option value="">— Seleccionar —</option>
          <option value="Riedel Palma">Riedel Palma</option>
          <option value="Chico">Chico</option>
          <option value="Solís Soto">Solís Soto</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Monto ($)</label>
        <input class="form-input" id="f-monto" type="number" placeholder="1.500.000" min="0">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label class="form-label">Ítem</label>
      <select class="form-select" id="f-item" onchange="onItemChange()">
        <option value="">— Seleccionar ítem —</option>
        <option value="Centro de Eventos">Centro de Eventos</option>
        <option value="Banquetera">Banquetera</option>
        <option value="DJ">DJ</option>
        <option value="Fotógrafo">Fotógrafo</option>
        <option value="Videógrafo">Videógrafo</option>
        <option value="Maquilladora">Maquilladora</option>
        <option value="Comida extra">Comida extra</option>
        <option value="Pista de Baile">Pista de Baile</option>
        <option value="Ceremonia">Ceremonia</option>
        <option value="Saxofonista">Saxofonista</option>
        <option value="Flores">Flores</option>
        <option value="Extras">Extras</option>
        <option value="Otro">Otro…</option>
      </select>
    </div>
    <div class="form-group" style="margin-bottom:12px" id="detalle-wrap">
      <label class="form-label" id="detalle-label">Comentario o detalle</label>
      <input class="form-input" id="f-detalle" type="text" placeholder="Ej: segunda cuota de banquetera">
    </div>

    <!-- Upload comprobante -->
    <div class="form-group" style="margin-bottom:16px">
      <label class="form-label">Comprobante (opcional)</label>
      <div class="upload-area" id="upload-area" onclick="document.getElementById('f-file').click()">
        <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0-3 3m3-3 3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.338-2.32 5.75 5.75 0 0 1 5.82 5.82"/>
        </svg>
        <p class="hint"><b>Haz clic para subir</b> o arrastra aquí</p>
        <p class="hint" style="font-size:12px;margin-top:2px">JPG, PNG o PDF · máx 10 MB</p>
        <div id="file-name" style="margin-top:8px;font-size:13px;color:var(--accent-fg);display:none"></div>
      </div>
      <input id="f-file" type="file" accept="image/*,.pdf" hidden>
    </div>

    <button class="btn btn-primary" id="btn-submit" onclick="submitPago()">
      Guardar pago
    </button>
  </div>

  <!-- Historial -->
  <div class="section-label">Historial de pagos</div>
  <div class="card" style="padding:0">
    <div id="pagos-list"><div class="loading"><div class="spinner"></div> Cargando…</div></div>
  </div>
</main>

<script type="module">
import { apiFetch, apiPost, fileToBase64, fmt, initTheme, highlightNav, showError, toast } from './api.js';

window.eliminarPago = async function(id) {
  if (!confirm('¿Eliminar este pago?')) return;
  try {
    const res = await apiPost({ action: 'deletePago', id });
    if (res.ok) { toast('Pago eliminado'); loadPagos(); }
    else toast(res.error || 'Error al eliminar', false);
  } catch(e) { toast(e.message || 'Error', false); }
};

window.editarPago = function(id, familia, concepto, monto) {
  document.getElementById('edit-id').value      = id;
  document.getElementById('edit-familia').value  = familia;
  document.getElementById('edit-concepto').value = concepto;
  document.getElementById('edit-monto').value    = monto;
  document.getElementById('edit-modal').style.display = 'flex';
};

window.cerrarModal = function() {
  document.getElementById('edit-modal').style.display = 'none';
};

window.guardarEdicion = async function() {
  const id      = document.getElementById('edit-id').value;
  const familia = document.getElementById('edit-familia').value;
  const concepto= document.getElementById('edit-concepto').value.trim();
  const monto   = parseFloat(document.getElementById('edit-monto').value);
  if (!familia || !concepto || !monto) { toast('Completa todos los campos', false); return; }
  try {
    const res = await apiPost({ action: 'editPago', id, data: { familia, concepto, monto } });
    if (res.ok) { toast('Pago actualizado ✓'); cerrarModal(); loadPagos(); }
    else toast(res.error || 'Error', false);
  } catch(e) { toast(e.message || 'Error', false); }
};

initTheme();
highlightNav();

window.onItemChange = () => {
  const item  = document.getElementById('f-item').value;
  const input = document.getElementById('f-detalle');
  if (item === 'Otro') {
    input.placeholder = 'Ej: Mozo extra, torta…';
  } else {
    input.placeholder = 'Ej: segunda cuota de banquetera';
  }
};

const listEl   = document.getElementById('pagos-list');
const areaEl   = document.getElementById('upload-area');
const fileEl   = document.getElementById('f-file');
const nameEl   = document.getElementById('file-name');

// ── Drag & drop ───────────────────────────────────────────────
areaEl.addEventListener('dragover',  e => { e.preventDefault(); areaEl.classList.add('drag'); });
areaEl.addEventListener('dragleave', () => areaEl.classList.remove('drag'));
areaEl.addEventListener('drop', e => {
  e.preventDefault();
  areaEl.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f) setFile(f);
});
fileEl.addEventListener('change', () => {
  if (fileEl.files[0]) setFile(fileEl.files[0]);
});
function setFile(f) {
  fileEl._file = f;
  nameEl.textContent = `📎 ${f.name}`;
  nameEl.style.display = 'block';
}

// ── Submit ────────────────────────────────────────────────────
window.submitPago = async () => {
  const familia  = document.getElementById('f-familia').value;
  const monto    = parseFloat(document.getElementById('f-monto').value);
  const item     = document.getElementById('f-item').value;
  const detalle  = document.getElementById('f-detalle').value.trim();
  const concepto = item === 'Otro' ? (detalle || 'Otro') : item + (detalle ? ` — ${detalle}` : '');
  const file     = fileEl._file;

  if (!familia)        { toast('Selecciona una familia', false); return; }
  if (!monto || monto <= 0) { toast('Ingresa un monto válido', false); return; }
  if (!item)           { toast('Selecciona un ítem', false); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  try {
    // 1. Registrar pago
    const { id } = await apiPost({ action: 'addPago', data: { familia, monto, concepto } });

    // 2. Si hay archivo, subirlo
    if (file) {
      btn.textContent = 'Subiendo comprobante…';
      const fileData = await fileToBase64(file);
      await apiPost({
        action: 'uploadComprobante',
        pagoId: id,
        fileData,
        fileName: file.name,
        mimeType: file.type || 'application/octet-stream',
      });
    }

    toast('✅ Pago registrado correctamente');
    // Limpiar form
    document.getElementById('f-familia').value = '';
    document.getElementById('f-monto').value   = '';
    document.getElementById('f-item').value    = '';
    document.getElementById('f-detalle').value = '';
    fileEl.value = '';
    fileEl._file = null;
    nameEl.style.display = 'none';
    loadPagos();

  } catch(e) {
    toast(`Error: ${e.message}`, false);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar pago';
  }
};

// ── Cargar historial ──────────────────────────────────────────
async function loadPagos() {
  try {
    const pagos = await apiFetch('pagos');
    if (!pagos.length) {
      listEl.innerHTML = '<p style="padding:20px;color:var(--fg-muted);font-size:13px">Aún no hay pagos registrados.</p>';
      return;
    }

    const totales = { 'Riedel Palma': 0, 'Chico': 0, 'Solís Soto': 0 };
    pagos.forEach(p => totales[p.familia] = (totales[p.familia]||0) + Number(p.monto));

    const rev = [...pagos].reverse();
    listEl.innerHTML = `
      <div style="display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--border);flex-wrap:wrap">
        <span style="font-size:13px;color:var(--fg-muted)">Total pagado:</span>
        <span style="font-size:13px;color:var(--r-color);font-weight:500">Riedel $${fmt(totales['Riedel Palma'])}</span>
        <span style="font-size:13px;color:var(--c-color);font-weight:500">Chico $${fmt(totales['Chico'])}</span>
        <span style="font-size:13px;color:var(--s-color);font-weight:500">Solís $${fmt(totales['Solís Soto'])}</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Fecha</th>
            <th>Familia</th>
            <th>Concepto</th>
            <th class="num">Monto</th>
            <th>Comprobante</th>
            <th></th>
          </tr></thead>
          <tbody>
            ${rev.map(p => `<tr>
              <td style="white-space:nowrap">${p.fecha}</td>
              <td><span class="badge badge-${p.familia==='Riedel Palma'?'r':p.familia==='Chico'?'c':'s'}">${p.familia}</span></td>
              <td>${p.concepto}</td>
              <td class="num">$${fmt(p.monto)}</td>
              <td>${p.comprobante
                ? `<a href="${p.comprobante}" target="_blank" class="btn" style="font-size:11px;padding:4px 10px">Ver 🔗</a>`
                : '<span style="color:var(--fg-faint);font-size:12px">—</span>'}</td>
              <td style="white-space:nowrap">
                ${!p.id.startsWith('G') ? `<button onclick="editarPago('${p.id}','${p.familia}',${JSON.stringify(p.concepto)},${p.monto})" style="background:none;border:none;cursor:pointer;color:var(--fg-muted);font-size:14px;padding:2px 5px;line-height:1" title="Editar">✏️</button>` : ''}
                <button onclick="eliminarPago('${p.id}')" style="background:none;border:none;cursor:pointer;color:var(--fg-faint);font-size:16px;padding:2px 5px;line-height:1" title="Eliminar">×</button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch(e) {
    showError(listEl, e.message);
  }
}

loadPagos();
</script>
</body>
</html>
