<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gastos — Matrimonio 2026</title>
<link rel="stylesheet" href="style.css">
<style>
/* Expandable rows */
tr.item-row {
  cursor: pointer;
  user-select: none;
}
tr.item-row:hover td {
  background: var(--hover-bg, rgba(0,0,0,.04));
}
tr.detail-row td {
  padding: 0 !important;
  border-top: none !important;
}
tr.detail-row .detail-inner {
  overflow: hidden;
  max-height: 0;
  transition: max-height .25s ease;
}
tr.detail-row.open .detail-inner {
  max-height: 200px;
}
.chevron {
  display: inline-block;
  font-size: 10px;
  margin-right: 5px;
  transition: transform .2s;
  color: var(--fg-faint);
}
tr.item-row.open .chevron {
  transform: rotate(90deg);
}
.family-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 12px 5px 28px;
  font-size: 12px;
  border-top: 1px solid var(--border);
}
.family-row:first-child { border-top: none; }
.family-row-label { width: 100px; font-weight: 500; white-space: nowrap; }
.family-row-bar { flex: 1; height: 6px; border-radius: 99px; background: var(--border); overflow: hidden; min-width: 60px; }
.family-row-fill { height: 100%; border-radius: 99px; }
.family-row-nums { white-space: nowrap; color: var(--fg-muted); min-width: 160px; text-align: right; }
.tab-btn {
  padding: 8px 18px;
  border: none;
  background: none;
  font-size: 14px;
  font-weight: 500;
  color: var(--fg-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color .15s, border-color .15s;
}
.tab-btn.active {
  color: var(--accent-fg, #3b82f6);
  border-bottom-color: var(--accent-fg, #3b82f6);
}
.tab-btn:hover:not(.active) {
  color: var(--fg);
}
/* Mini stacked bar */
.pay-bar {
  display: flex;
  height: 10px;
  border-radius: 99px;
  overflow: hidden;
  background: var(--border);
  min-width: 80px;
  width: 100%;
}
.pay-bar-seg {
  height: 100%;
  transition: width .3s;
}
/* Mini % bar */
.pct-bar {
  display: flex;
  height: 8px;
  border-radius: 99px;
  overflow: hidden;
  background: var(--border);
  min-width: 60px;
}
.pct-fill {
  height: 100%;
  border-radius: 99px;
  transition: width .3s;
}
</style>
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="index.html">💍 Matrimonio 2026</a>
    <ul class="site-nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="gastos.html">Gastos</a></li>
      <li><a href="invitados.html">Invitados</a></li>
      <li><a href="pagos.html">Pagos</a></li>
    </ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
  </div>
</nav>

<main class="page">
  <h1 class="page-title">Gastos detallados</h1>

  <!-- Stat tiles siempre en bruto -->
  <div class="stat-grid" style="margin-bottom:24px" id="tiles"></div>

  <!-- Tabs -->
  <div style="display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border)">
    <button class="tab-btn active" id="tab-dist" onclick="setTab('dist')">Distribución</button>
    <button class="tab-btn" id="tab-pagos" onclick="setTab('pagos')">Pagos</button>
  </div>

  <!-- Controles distribución -->
  <div id="ctrl-dist" style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
    <button class="btn btn-primary" id="btn-mode" onclick="toggleMode()">Ver neto (sin IVA)</button>
    <button class="btn" id="btn-r" onclick="toggleFam('r')">Riedel Palma</button>
    <button class="btn" id="btn-c" onclick="toggleFam('c')">Chico</button>
    <button class="btn" id="btn-s" onclick="toggleFam('s')">Solís Soto</button>
  </div>

  <div id="root"></div>
</main>

<script type="module">
import { apiFetch, fmt, initTheme, highlightNav } from './api.js';

initTheme();
highlightNav();

// ── Items fijos (excluye Banquetera — viene de la API) ────────
const ITEMS_FIXED = [
  { item:'Centro de Eventos', rn:4423284, rb:5263708, cn:2211642, cb:2631854, sn:2211642, sb:2631854, pr:2114095, pc:0,      ps:2150000 },
  { item:'DJ',                rn:777311,  rb:925000,  cn:388655,  cb:462500,  sn:388655,  sb:462500,  pr:0,       pc:925000, ps:0       },
  { item:'Fotógrafo',         rn:756303,  rb:900000,  cn:378151,  cb:450000,  sn:378151,  sb:450000,  pr:900000,  pc:0,      ps:0       },
  { item:'Videógrafo',        rn:546218,  rb:650000,  cn:273109,  cb:325000,  sn:273109,  sb:325000,  pr:0,       pc:650000, ps:0       },
  { item:'Maquilladora',      rn:0,       rb:0,       cn:0,       cb:0,       sn:0,       sb:0,       pr:0,       pc:0,      ps:0,      est:true },
  { item:'Comida extra',      rn:30000,   rb:35700,   cn:15000,   cb:17850,   sn:15000,   sb:17850,   pr:0,       pc:0,      ps:0       },
  { item:'Pista de Baile',    rn:261765,  rb:311500,  cn:130882,  cb:155750,  sn:130882,  sb:155750,  pr:0,       pc:311500, ps:0       },
  { item:'Ceremonia',         rn:0,       rb:0,       cn:0,       cb:0,       sn:0,       sb:0,       pr:0,       pc:0,      ps:0,      est:true },
  { item:'Saxofonista',       rn:105042,  rb:125000,  cn:52521,   cb:62500,   sn:52521,   sb:62500,   pr:62500,   pc:62500,  ps:0       },
  { item:'Flores',            rn:800000,  rb:952000,  cn:400000,  cb:476000,  sn:400000,  sb:476000,  pr:0,       pc:0,      ps:0,      est:true },
  { item:'Extras',            rn:4292500, rb:5108075, cn:2146250, cb:2554038, sn:2146250, sb:2554038, pr:0,       pc:0,      ps:0,      est:true },
];

let mode   = 'bruto';
let tab    = 'dist';
let vis    = { r:true, c:true, s:true };
let ITEMS  = ITEMS_FIXED.slice();
let TOTALS = {};
let PAGADO = { r:0, c:0, s:0 };

function computeTotals(items) {
  return items.reduce((acc, x) => {
    acc.rb += x.rb; acc.rn += x.rn;
    acc.cb += x.cb; acc.cn += x.cn;
    acc.sb += x.sb; acc.sn += x.sn;
    acc.tb += x.rb + x.cb + x.sb;
    acc.tn += x.rn + x.cn + x.sn;
    acc.pr += x.pr; acc.pc += x.pc; acc.ps += x.ps;
    return acc;
  }, { rb:0, rn:0, cb:0, cn:0, sb:0, sn:0, tb:0, tn:0, pr:0, pc:0, ps:0 });
}

window.setTab = t => {
  tab = t;
  document.getElementById('tab-dist').classList.toggle('active', t === 'dist');
  document.getElementById('tab-pagos').classList.toggle('active', t === 'pagos');
  document.getElementById('ctrl-dist').style.display = t === 'dist' ? 'flex' : 'none';
  renderTable();
};

window.toggleMode = () => {
  mode = mode === 'neto' ? 'bruto' : 'neto';
  document.getElementById('btn-mode').textContent = mode === 'neto' ? 'Ver bruto (con IVA)' : 'Ver neto (sin IVA)';
  renderTable();
};

function renderTiles() {
  const T = TOTALS;
  const P = PAGADO;
  const ptotal = P.r + P.c + P.s;

  function tile(label, cls, bruto, neto, pag) {
    const pct  = bruto > 0 ? Math.min(100, Math.round(pag / bruto * 100)) : 0;
    const pend = Math.max(0, bruto - pag);
    return `
    <div class="stat-tile ${cls}">
      <div class="label">${label}</div>
      <div class="value">$${fmt(bruto)}</div>
      <div class="sub" style="display:flex;flex-direction:column;gap:2px">
        <span>neto $${fmt(neto)}</span>
        <span>pagado $${fmt(pag)} · pendiente $${fmt(pend)}</span>
      </div>
      <div class="progress-wrap"><div class="progress-track">
        <div class="progress-fill" style="width:${pct}%;background:var(--${cls}-color)"></div>
      </div></div>
      <div style="font-size:11px;color:var(--fg-faint);margin-top:2px;text-align:right">${pct}%</div>
    </div>`;
  }

  const pctTotal = T.tb > 0 ? Math.min(100, Math.round(ptotal / T.tb * 100)) : 0;
  const totalTile = `
    <div class="stat-tile t">
      <div class="label">Total</div>
      <div class="value">$${fmt(T.tb)}</div>
      <div class="sub" style="display:flex;flex-direction:column;gap:2px">
        <span>neto $${fmt(T.tn)}</span>
        <span>pagado $${fmt(ptotal)} · pendiente $${fmt(Math.max(0,T.tb-ptotal))}</span>
      </div>
      <div class="progress-wrap"><div class="progress-track">
        <div class="progress-fill" style="width:${pctTotal}%"></div>
      </div></div>
      <div style="font-size:11px;color:var(--fg-faint);margin-top:2px;text-align:right">${pctTotal}%</div>
    </div>`;

  document.getElementById('tiles').innerHTML =
    tile('Riedel Palma', 'r', T.rb, T.rn, P.r) +
    tile('Chico',        'c', T.cb, T.cn, P.c) +
    tile('Solís Soto',   's', T.sb, T.sn, P.s) +
    totalTile;
}

window.toggleFam = k => {
  vis[k] = !vis[k];
  document.getElementById(`btn-${k}`).style.opacity = vis[k] ? '1' : '0.4';
  renderTable();
};

// ── Toggle expand ─────────────────────────────────────────────
window.toggleRow = id => {
  const row = document.getElementById(`item-${id}`);
  const det = document.getElementById(`det-${id}`);
  if (!row || !det) return;
  const open = row.classList.toggle('open');
  det.classList.toggle('open', open);
};

// ── Detail markup (per-family breakdown) ──────────────────────
function detailHtml(row, colspan) {
  const families = [
    { label:'Riedel Palma', share: row.rb, pag: row.pr, color:'var(--r-color)' },
    { label:'Chico',        share: row.cb, pag: row.pc, color:'var(--c-color)' },
    { label:'Solís Soto',   share: row.sb, pag: row.ps, color:'var(--s-color)' },
  ];
  const inner = families.map(f => {
    const pct  = f.share > 0 ? Math.min(100, Math.round(f.pag / f.share * 100)) : 0;
    const pend = Math.max(0, f.share - f.pag);
    return `<div class="family-row">
      <div class="family-row-label" style="color:${f.color}">${f.label}</div>
      <div class="family-row-bar">
        <div class="family-row-fill" style="width:${pct}%;background:${f.color}"></div>
      </div>
      <div class="family-row-nums">
        $${fmt(f.pag)} pagado · <span style="color:${pend>0?'var(--fg-muted)':'var(--s-color)'}">$${fmt(pend)} pend.</span>
        <span style="margin-left:6px;font-weight:600;color:${pct>=100?'var(--s-color)':pct>0?'var(--c-color)':'var(--fg-faint)'}">${pct}%</span>
      </div>
    </div>`;
  }).join('');
  return `<tr class="detail-row" id="det-${row._id}">
    <td colspan="${colspan}" style="padding:0;border-top:none">
      <div class="detail-inner">${inner}</div>
    </td>
  </tr>`;
}

// ── Mini stacked payment bar ──────────────────────────────────
function stackedBar(row) {
  const total = row.rb + row.cb + row.sb;
  if (!total) return '<span style="color:var(--fg-faint);font-size:12px">—</span>';
  const pr = Math.min(row.pr, row.rb);
  const pc = Math.min(row.pc, row.cb);
  const ps = Math.min(row.ps, row.sb);
  const pct = v => Math.min(100, Math.round(v / total * 100));
  return `<div style="display:flex;flex-direction:column;gap:3px;min-width:80px">
    <div class="pay-bar">
      <div class="pay-bar-seg" style="width:${pct(pr)}%;background:var(--r-color)"></div>
      <div class="pay-bar-seg" style="width:${pct(pc)}%;background:var(--c-color)"></div>
      <div class="pay-bar-seg" style="width:${pct(ps)}%;background:var(--s-color)"></div>
    </div>
    <div style="font-size:10px;color:var(--fg-faint);text-align:right">${pct(pr+pc+ps)}%</div>
  </div>`;
}

// ── Mini % bar for dist tab ────────────────────────────────────
function pctBar(pag, total) {
  if (!total) return '<span style="color:var(--fg-faint);font-size:12px">—</span>';
  const pct = Math.min(100, Math.round(pag / total * 100));
  const color = pct >= 100 ? 'var(--s-color)' : pct > 0 ? 'var(--c-color)' : 'var(--border)';
  return `<div style="display:flex;flex-direction:column;gap:3px;min-width:60px">
    <div class="pct-bar"><div class="pct-fill" style="width:${pct}%;background:${color}"></div></div>
    <div style="font-size:10px;color:var(--fg-faint);text-align:right">${pct}%</div>
  </div>`;
}

function renderTable() {
  const m = mode;
  const CONF = computeTotals(ITEMS.filter(x => !x.est));
  const EST  = computeTotals(ITEMS.filter(x =>  x.est));

  if (tab === 'dist') {
    renderDist(m, CONF, EST);
  } else {
    renderPagos(CONF, EST);
  }
}

function renderDist(m, CONF, EST) {
  const cols = [];
  if (vis.r) cols.push({ key: m==='neto'?'rn':'rb', label:'Riedel', cls:'badge-r' });
  if (vis.c) cols.push({ key: m==='neto'?'cn':'cb', label:'Chico',  cls:'badge-c' });
  if (vis.s) cols.push({ key: m==='neto'?'sn':'sb', label:'Solís',  cls:'badge-s' });

  function visTotal(T) {
    return (vis.r?T[m==='neto'?'rn':'rb']:0)+
           (vis.c?T[m==='neto'?'cn':'cb']:0)+
           (vis.s?T[m==='neto'?'sn':'sb']:0);
  }

  document.getElementById('root').innerHTML = `
    <div class="card" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Ítem</th>
          ${cols.map(c=>`<th class="num"><span class="badge ${c.cls}">${c.label}</span></th>`).join('')}
          <th class="num">Total</th>
          <th>Pagado</th>
        </tr></thead>
        <tbody>
          ${ITEMS.map((row, i)=>{
            const est = row.est;
            row._id = i;
            const rowTotal = row.rb + row.cb + row.sb;
            const rowPag   = row.pr + row.pc + row.ps;
            const ncols = cols.length + 3; // item + family cols + total + pagado
            return `<tr class="item-row${est?' style-muted':''}" id="item-${i}"
                onclick="toggleRow(${i})"
                ${est?'style="color:var(--fg-muted)"':''}>
              <td><span class="chevron">▶</span>${est
                ? `<em style="font-style:italic">${row.item}</em>`
                : `<strong>${row.item}</strong>`
              }${est?' <span style="font-size:10px;opacity:0.6">(ref.)</span>':''}</td>
              ${cols.map(c=>`<td class="num">$${fmt(row[c.key])}</td>`).join('')}
              <td class="num" style="font-weight:500">$${fmt(
                (vis.r?(m==='neto'?row.rn:row.rb):0)+
                (vis.c?(m==='neto'?row.cn:row.cb):0)+
                (vis.s?(m==='neto'?row.sn:row.sb):0)
              )}</td>
              <td style="padding-right:8px">${pctBar(rowPag, rowTotal)}</td>
            </tr>
            ${detailHtml(row, ncols)}`;
          }).join('')}
        </tbody>
        <tfoot>
          ${[
            { T:CONF,   label:'Confirmado', style:'font-weight:600;border-top:2px solid var(--border)', em:false },
            { T:EST,    label:'+ Estimado', style:'color:var(--fg-muted);font-size:13px', em:true },
            { T:TOTALS, label:'TOTAL',      style:'font-weight:700;border-top:1px solid var(--border)', em:false },
          ].map(({T,label,style,em})=>{
            const tb  = T.rb + T.cb + T.sb;
            const pag = T.pr + T.pc + T.ps;
            const w = v => em ? `<em>$${fmt(v)}</em>` : `$${fmt(v)}`;
            return `<tr style="${style}">
              <td>${em?`<em>${label}</em>`:label}</td>
              ${cols.map(c=>`<td class="num">${w(T[c.key])}</td>`).join('')}
              <td class="num">${w(visTotal(T))}</td>
              <td style="padding-right:8px">${pctBar(pag, tb)}</td>
            </tr>`;
          }).join('')}
        </tfoot>
      </table></div>
    </div>
    <p style="margin-top:10px;font-size:12px;color:var(--fg-faint)">
      Modo: <strong>${m==='neto'?'Neto (sin IVA — 9,5% Banquetera / 19% resto)':'Bruto (con IVA — 9,5% Banquetera / 19% resto)'}</strong>
      · <em>Ítems en cursiva son valores referenciales sin contrato firmado.</em>
    </p>`;
}

function renderPagos(CONF, EST) {
  document.getElementById('root').innerHTML = `
    <div class="card" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Ítem</th>
          <th class="num">Costo total</th>
          <th style="min-width:110px">R / C / S</th>
          <th class="num">Pagado</th>
          <th class="num">Pendiente</th>
        </tr></thead>
        <tbody>
          ${ITEMS.map((row, i)=>{
            const est   = row.est;
            row._id = i;
            const total = row.rb + row.cb + row.sb;
            const pag   = row.pr + row.pc + row.ps;
            const pend  = Math.max(0, total - pag);
            return `<tr class="item-row" id="item-${i}"
                onclick="toggleRow(${i})"
                ${est?'style="color:var(--fg-muted)"':''}>
              <td><span class="chevron">▶</span>${est
                ? `<em>${row.item}</em>`
                : `<strong>${row.item}</strong>`
              }${est?' <span style="font-size:10px;opacity:0.6">(ref.)</span>':''}</td>
              <td class="num">$${fmt(total)}</td>
              <td style="padding-right:8px">${stackedBar(row)}</td>
              <td class="num" style="color:${pag>0?'var(--s-color)':'var(--fg-faint)'}">$${fmt(pag)}</td>
              <td class="num" style="color:${pend>0?'var(--r-color)':'var(--fg-faint)'}">$${pend>0?fmt(pend):'—'}</td>
            </tr>
            ${detailHtml(row, 5)}`;
          }).join('')}
        </tbody>
        <tfoot>
          ${[
            { T:CONF,   label:'Confirmado', style:'font-weight:600;border-top:2px solid var(--border)', em:false },
            { T:EST,    label:'+ Estimado', style:'color:var(--fg-muted);font-size:13px', em:true },
            { T:TOTALS, label:'TOTAL',      style:'font-weight:700;border-top:1px solid var(--border)', em:false },
          ].map(({T,label,style,em})=>{
            const tb  = T.rb + T.cb + T.sb;
            const pag = T.pr + T.pc + T.ps;
            const pend = Math.max(0, tb - pag);
            const w = v => em ? `<em>$${fmt(v)}</em>` : `$${fmt(v)}`;
            // tfoot stacked bar using totals
            const fakeRow = { rb:T.rb, cb:T.cb, sb:T.sb, pr:T.pr, pc:T.pc, ps:T.ps };
            return `<tr style="${style}">
              <td>${em?`<em>${label}</em>`:label}</td>
              <td class="num">${w(tb)}</td>
              <td style="padding-right:8px">${em ? '' : stackedBar(fakeRow)}</td>
              <td class="num" style="color:${pag>0?'var(--s-color)':'var(--fg-faint)'}">${w(pag)}</td>
              <td class="num" style="color:${pend>0?'var(--r-color)':'var(--fg-faint)'}">${w(pend)}</td>
            </tr>`;
          }).join('')}
        </tfoot>
      </table></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:16px;font-size:12px;color:var(--fg-muted);flex-wrap:wrap">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--r-color);vertical-align:middle;margin-right:4px"></span>Riedel Palma</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c-color);vertical-align:middle;margin-right:4px"></span>Chico</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--s-color);vertical-align:middle;margin-right:4px"></span>Solís Soto</span>
      <span style="margin-left:4px;color:var(--fg-faint)"><em>Ítems en cursiva son valores referenciales.</em></span>
    </div>`;
}

function computePagado(pagos) {
  const p = { r:0, c:0, s:0 };
  (pagos || []).forEach(pago => {
    const k = pago.familia === 'Riedel Palma' ? 'r' : pago.familia === 'Chico' ? 'c' : 's';
    p[k] += Number(pago.monto) || 0;
  });
  return p;
}

async function init() {
  ITEMS  = ITEMS_FIXED.slice();
  TOTALS = computeTotals(ITEMS);
  renderTiles();
  renderTable();

  try {
    const [banq, pagos] = await Promise.all([
      apiFetch('banquetera'),
      apiFetch('pagos'),
    ]);

    if (banq && !banq.error) {
      const banqRow = {
        item: 'Banquetera',
        rn: banq.rn||0, rb: banq.rb||0,
        cn: banq.cn||0, cb: banq.cb||0,
        sn: banq.sn||0, sb: banq.sb||0,
        pr: 1500000, pc: 0, ps: 1500000,
      };
      ITEMS  = [ITEMS_FIXED[0], banqRow, ...ITEMS_FIXED.slice(1)];
      TOTALS = computeTotals(ITEMS);
    }

    PAGADO = computePagado(pagos);
    renderTiles();
    renderTable();
  } catch(e) { /* continúa sin datos remotos */ }
}

init();
</script>
</body>
</html>
