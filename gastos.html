<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gastos — Matrimonio 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="index.html">💍 Matrimonio 2026</a>
    <ul class="site-nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="gastos.html">Gastos</a></li>
      <li><a href="invitados.html">Invitados</a></li>
      <li><a href="pagos.html">Pagos</a></li>
    </ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
  </div>
</nav>

<main class="page">
  <h1 class="page-title">Gastos detallados</h1>

  <!-- Stat tiles siempre en bruto -->
  <div class="stat-grid" style="margin-bottom:24px" id="tiles"></div>

  <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center">
    <button class="btn btn-primary" id="btn-mode" onclick="toggleMode()">Ver neto (sin IVA)</button>
    <button class="btn" id="btn-r" onclick="toggleFam('r')">Riedel Palma</button>
    <button class="btn" id="btn-c" onclick="toggleFam('c')">Chico</button>
    <button class="btn" id="btn-s" onclick="toggleFam('s')">Solís Soto</button>
  </div>

  <div id="root"></div>
</main>

<script type="module">
import { apiFetch, fmt, initTheme, highlightNav } from './api.js';
initTheme();
highlightNav();

// ── Items fijos (excluye Banquetera — viene de la API) ────────
// Neto según contratos. Bruto = neto × 1.19. Distribución 50/25/25
// Maquilladora y Ceremonia sin precio confirmado aún → ceros
const ITEMS_FIXED = [
  { item:'Centro de Eventos', rn:4423284, rb:5263708, cn:2211642, cb:2631854, sn:2211642, sb:2631854, pr:2114095, pc:0,      ps:2150000 },
  { item:'DJ',                rn:925000,  rb:1100750, cn:462500,  cb:550375,  sn:462500,  sb:550375,  pr:0,       pc:925000, ps:0       },
  { item:'Fotógrafo',         rn:900000,  rb:1071000, cn:450000,  cb:535500,  sn:450000,  sb:535500,  pr:900000,  pc:0,      ps:0       },
  { item:'Videógrafo',        rn:650000,  rb:773500,  cn:325000,  cb:386750,  sn:325000,  sb:386750,  pr:0,       pc:650000, ps:0       },
  { item:'Maquilladora',      rn:0,       rb:0,       cn:0,       cb:0,       sn:0,       sb:0,       pr:0,       pc:0,      ps:0,      est:true },
  { item:'Comida extra',      rn:30000,   rb:35700,   cn:15000,   cb:17850,   sn:15000,   sb:17850,   pr:0,       pc:0,      ps:0       },
  { item:'Pista de Baile',    rn:330000,  rb:392700,  cn:165000,  cb:196350,  sn:165000,  sb:196350,  pr:0,       pc:311500, ps:0       },
  { item:'Ceremonia',         rn:0,       rb:0,       cn:0,       cb:0,       sn:0,       sb:0,       pr:0,       pc:0,      ps:0,      est:true },
  { item:'Saxofonista',       rn:125000,  rb:148750,  cn:62500,   cb:74375,   sn:62500,   sb:74375,   pr:62500,   pc:62500,  ps:0       },
  { item:'Flores',            rn:800000,  rb:952000,  cn:400000,  cb:476000,  sn:400000,  sb:476000,  pr:0,       pc:0,      ps:0,      est:true },
  { item:'Extras',            rn:4292500, rb:5108075, cn:2146250, cb:2554038, sn:2146250, sb:2554038, pr:0,       pc:0,      ps:0,      est:true },
];

let mode = 'bruto';
let vis  = { r:true, c:true, s:true };
let ITEMS  = ITEMS_FIXED.slice();
let TOTALS = {};

function computeTotals(items) {
  return items.reduce((acc, x) => {
    acc.rb += x.rb; acc.rn += x.rn;
    acc.cb += x.cb; acc.cn += x.cn;
    acc.sb += x.sb; acc.sn += x.sn;
    acc.tb += x.rb + x.cb + x.sb;
    acc.tn += x.rn + x.cn + x.sn;
    acc.pr += x.pr; acc.pc += x.pc; acc.ps += x.ps;
    return acc;
  }, { rb:0, rn:0, cb:0, cn:0, sb:0, sn:0, tb:0, tn:0, pr:0, pc:0, ps:0 });
}

window.toggleMode = () => {
  mode = mode === 'neto' ? 'bruto' : 'neto';
  document.getElementById('btn-mode').textContent = mode === 'neto' ? 'Ver bruto (con IVA)' : 'Ver neto (sin IVA)';
  renderTable();
};

function renderTiles() {
  const T = TOTALS;
  const tiles = [
    { label:'Riedel Palma', cls:'r', rb:T.rb, rn:T.rn },
    { label:'Chico',        cls:'c', rb:T.cb, rn:T.cn },
    { label:'Solís Soto',   cls:'s', rb:T.sb, rn:T.sn },
    { label:'Total',        cls:'t', rb:T.tb, rn:T.tn },
  ];
  document.getElementById('tiles').innerHTML = tiles.map(t => `
    <div class="stat-tile ${t.cls}">
      <div class="label">${t.label}</div>
      <div class="value">$${fmt(t.rb)}</div>
      <div class="sub">neto $${fmt(t.rn)}</div>
    </div>
  `).join('');
}

window.toggleFam = k => {
  vis[k] = !vis[k];
  document.getElementById(`btn-${k}`).style.opacity = vis[k] ? '1' : '0.4';
  renderTable();
};

function renderTable() {
  const m = mode;
  const cols = [];
  if (vis.r) cols.push({ key: m==='neto'?'rn':'rb', label:'Riedel', cls:'badge-r' });
  if (vis.c) cols.push({ key: m==='neto'?'cn':'cb', label:'Chico',  cls:'badge-c' });
  if (vis.s) cols.push({ key: m==='neto'?'sn':'sb', label:'Solís',  cls:'badge-s' });

  // Subtotales separados: confirmado vs estimado
  const CONF = computeTotals(ITEMS.filter(x => !x.est));
  const EST  = computeTotals(ITEMS.filter(x =>  x.est));

  function visTotal(T) {
    return (vis.r?T[m==='neto'?'rn':'rb']:0)+
           (vis.c?T[m==='neto'?'cn':'cb']:0)+
           (vis.s?T[m==='neto'?'sn':'sb']:0);
  }

  document.getElementById('root').innerHTML = `
    <div class="card" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Ítem</th>
          ${cols.map(c=>`<th class="num"><span class="badge ${c.cls}">${c.label}</span></th>`).join('')}
          <th class="num">Total</th>
          <th class="num" style="color:var(--r-color)">Pag. R</th>
          <th class="num" style="color:var(--c-color)">Pag. C</th>
          <th class="num" style="color:var(--s-color)">Pag. S</th>
        </tr></thead>
        <tbody>
          ${ITEMS.map(row=>{
            const est = row.est;
            return `<tr${est?' style="color:var(--fg-muted)"':''}>
              <td>${est
                ? `<em style="font-style:italic">${row.item}</em>`
                : `<strong>${row.item}</strong>`
              }${est?' <span style="font-size:10px;opacity:0.6">(ref.)</span>':''}</td>
              ${cols.map(c=>`<td class="num">$${fmt(row[c.key])}</td>`).join('')}
              <td class="num" style="font-weight:500">$${fmt(
                (vis.r?(m==='neto'?row.rn:row.rb):0)+
                (vis.c?(m==='neto'?row.cn:row.cb):0)+
                (vis.s?(m==='neto'?row.sn:row.sb):0)
              )}</td>
              <td class="num" style="color:var(--r-color)">$${fmt(row.pr)}</td>
              <td class="num" style="color:var(--c-color)">$${fmt(row.pc)}</td>
              <td class="num" style="color:var(--s-color)">$${fmt(row.ps)}</td>
            </tr>`;
          }).join('')}
        </tbody>
        <tfoot>
          <tr style="border-top:2px solid var(--border)">
            <td style="font-weight:600">Confirmado</td>
            ${cols.map(c=>`<td class="num" style="font-weight:600">$${fmt(CONF[c.key])}</td>`).join('')}
            <td class="num" style="font-weight:600">$${fmt(visTotal(CONF))}</td>
            <td class="num" style="color:var(--r-color);font-weight:600">$${fmt(CONF.pr)}</td>
            <td class="num" style="color:var(--c-color);font-weight:600">$${fmt(CONF.pc)}</td>
            <td class="num" style="color:var(--s-color);font-weight:600">$${fmt(CONF.ps)}</td>
          </tr>
          <tr style="color:var(--fg-muted);font-size:13px">
            <td><em>+ Estimado</em></td>
            ${cols.map(c=>`<td class="num"><em>$${fmt(EST[c.key])}</em></td>`).join('')}
            <td class="num"><em>$${fmt(visTotal(EST))}</em></td>
            <td class="num" style="color:var(--r-color)"><em>$${fmt(EST.pr)}</em></td>
            <td class="num" style="color:var(--c-color)"><em>$${fmt(EST.pc)}</em></td>
            <td class="num" style="color:var(--s-color)"><em>$${fmt(EST.ps)}</em></td>
          </tr>
          <tr style="font-weight:700;border-top:1px solid var(--border)">
            <td>TOTAL</td>
            ${cols.map(c=>`<td class="num">$${fmt(TOTALS[c.key])}</td>`).join('')}
            <td class="num">$${fmt(visTotal(TOTALS))}</td>
            <td class="num" style="color:var(--r-color)">$${fmt(TOTALS.pr)}</td>
            <td class="num" style="color:var(--c-color)">$${fmt(TOTALS.pc)}</td>
            <td class="num" style="color:var(--s-color)">$${fmt(TOTALS.ps)}</td>
          </tr>
        </tfoot>
      </table></div>
    </div>
    <p style="margin-top:10px;font-size:12px;color:var(--fg-faint)">
      Modo: <strong>${m==='neto'?'Neto (sin IVA — 9,5% Banquetera / 19% resto)':'Bruto (con IVA — 9,5% Banquetera / 19% resto)'}</strong>
      · <em>Ítems en cursiva son valores referenciales sin contrato firmado.</em>
    </p>`;
}

async function init() {
  // Render con items fijos mientras carga la Banquetera
  ITEMS  = ITEMS_FIXED.slice();
  TOTALS = computeTotals(ITEMS);
  renderTiles();
  renderTable();

  // Banquetera dinámica desde invitados
  try {
    const banq = await apiFetch('banquetera');
    if (banq && !banq.error) {
      const banqRow = {
        item: 'Banquetera',
        rn: banq.rn || 0, rb: banq.rb || 0,
        cn: banq.cn || 0, cb: banq.cb || 0,
        sn: banq.sn || 0, sb: banq.sb || 0,
        pr: 1500000, pc: 0, ps: 1500000,
      };
      // Banquetera va después de Centro de Eventos
      ITEMS  = [ITEMS_FIXED[0], banqRow, ...ITEMS_FIXED.slice(1)];
      TOTALS = computeTotals(ITEMS);
      renderTiles();
      renderTable();
    }
  } catch(e) { /* se queda sin Banquetera */ }
}

init();
</script>
</body>
</html>
