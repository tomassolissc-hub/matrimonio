<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gastos — Matrimonio 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="index.html">💍 Matrimonio 2026</a>
    <ul class="site-nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="gastos.html">Gastos</a></li>
      <li><a href="invitados.html">Invitados</a></li>
      <li><a href="pagos.html">Pagos</a></li>
    </ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
  </div>
</nav>

<main class="page">
  <h1 class="page-title">Gastos detallados</h1>

  <!-- Stat tiles siempre en bruto -->
  <div class="stat-grid" style="margin-bottom:24px" id="tiles"></div>

  <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center">
    <button class="btn btn-primary" id="btn-mode" onclick="toggleMode()">Ver neto (sin IVA)</button>
    <button class="btn" id="btn-r" onclick="toggleFam('r')">Riedel Palma</button>
    <button class="btn" id="btn-c" onclick="toggleFam('c')">Chico</button>
    <button class="btn" id="btn-s" onclick="toggleFam('s')">Solís Soto</button>
  </div>

  <div id="root"></div>
</main>

<script type="module">
import { fmt, initTheme, highlightNav } from './api.js';
initTheme();
highlightNav();

// ── Datos (mismos del artifact v12) ──────────────────────────
const ITEMS = [
  { item:'Centro de Eventos',  rb:3147581,  rn:2307481,  cb:2630838,  cn:2210788,  sb:480838,   sn:60788,   pr:2114095, pc:0,       ps:2150000 },
  { item:'Banquetera',         rb:19803290, rn:17955060, cb:8182170,  cn:7472302,  sb:5748927,  sn:5120025, pr:1500000, pc:0,       ps:1500000 },
  { item:'DJ',                 rb:1190000,  rn:1190000,  cb:595000,   cn:595000,   sb:595000,   sn:595000,  pr:0,       pc:0,       ps:0       },
  { item:'Fotógrafo',          rb:1785000,  rn:1785000,  cb:892500,   cn:892500,   sb:892500,   sn:892500,  pr:0,       pc:0,       ps:0       },
  { item:'Videógrafo',         rb:1190000,  rn:1190000,  cb:595000,   cn:595000,   sb:595000,   sn:595000,  pr:0,       pc:0,       ps:0       },
  { item:'Maquilladora',       rb:0,        rn:0,        cb:0,        cn:0,        sb:725000,   sn:725000,  pr:0,       pc:0,       ps:0       },
  { item:'Comida extra',       rb:476000,   rn:476000,   cb:238000,   cn:238000,   sb:238000,   sn:238000,  pr:0,       pc:0,       ps:0       },
  { item:'Pista de Baile',     rb:654500,   rn:654500,   cb:327250,   cn:327250,   sb:327250,   sn:327250,  pr:0,       pc:0,       ps:0       },
  { item:'Saxofonista',        rb:357000,   rn:357000,   cb:178500,   cn:178500,   sb:178500,   sn:178500,  pr:0,       pc:0,       ps:0       },
  { item:'Flores',             rb:2380000,  rn:2380000,  cb:1190000,  cn:1190000,  sb:1190000,  sn:1190000, pr:962500,  pc:0,       ps:0       },
  { item:'Extras',             rb:759125,   rn:757500,   cb:812688,   cn:811000,   sb:556688,   sn:505000,  pr:0,       pc:1949000, ps:0       },
];

const TOTALS = {
  rb:31842496, rn:28852541, cb:15641946, cn:13310340, sb:11527703, sn:9207063,
  tb:59012145, tn:51369944, pr:4576595,  pc:1949000,  ps:3650000,
};

let mode = 'bruto';
let vis  = { r:true, c:true, s:true };

window.toggleMode = () => {
  mode = mode === 'neto' ? 'bruto' : 'neto';
  document.getElementById('btn-mode').textContent = mode === 'neto' ? 'Ver bruto (con IVA)' : 'Ver neto (sin IVA)';
  renderTable();
};

function renderTiles() {
  const tiles = [
    { k:'r', label:'Riedel Palma', cls:'r', rb:TOTALS.rb, rn:TOTALS.rn },
    { k:'c', label:'Chico',        cls:'c', rb:TOTALS.cb, rn:TOTALS.cn },
    { k:'s', label:'Solís Soto',   cls:'s', rb:TOTALS.sb, rn:TOTALS.sn },
    { k:'t', label:'Total',        cls:'t', rb:TOTALS.tb, rn:TOTALS.tn },
  ];
  document.getElementById('tiles').innerHTML = tiles.map(t => `
    <div class="stat-tile ${t.cls}">
      <div class="label">${t.label}</div>
      <div class="value">$${fmt(t.rb)}</div>
      <div class="sub">neto $${fmt(t.rn)}</div>
    </div>
  `).join('');
}

window.toggleFam = k => {
  vis[k] = !vis[k];
  document.getElementById(`btn-${k}`).style.opacity = vis[k] ? '1' : '0.4';
  renderTable();
};

function renderTable() {
  const m = mode;
  const cols = [];
  if (vis.r) cols.push({ key: m==='neto'?'rn':'rb', label:'Riedel', cls:'badge-r', cv:'--r-color' });
  if (vis.c) cols.push({ key: m==='neto'?'cn':'cb', label:'Chico',  cls:'badge-c', cv:'--c-color' });
  if (vis.s) cols.push({ key: m==='neto'?'sn':'sb', label:'Solís',  cls:'badge-s', cv:'--s-color' });
  const tk = m==='neto'?'tn':'tb';

  document.getElementById('root').innerHTML = `
    <div class="card" style="padding:0">
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Ítem</th>
          ${cols.map(c=>`<th class="num"><span class="badge ${c.cls}">${c.label}</span></th>`).join('')}
          <th class="num">Total</th>
          <th class="num" style="color:var(--r-color)">Pag. R</th>
          <th class="num" style="color:var(--c-color)">Pag. C</th>
          <th class="num" style="color:var(--s-color)">Pag. S</th>
        </tr></thead>
        <tbody>
          ${ITEMS.map(row=>`<tr>
            <td><strong>${row.item}</strong></td>
            ${cols.map(c=>`<td class="num">$${fmt(row[c.key])}</td>`).join('')}
            <td class="num" style="font-weight:500">$${fmt(
              (vis.r?(m==='neto'?row.rn:row.rb):0)+
              (vis.c?(m==='neto'?row.cn:row.cb):0)+
              (vis.s?(m==='neto'?row.sn:row.sb):0)
            )}</td>
            <td class="num" style="color:var(--r-color)">$${fmt(row.pr)}</td>
            <td class="num" style="color:var(--c-color)">$${fmt(row.pc)}</td>
            <td class="num" style="color:var(--s-color)">$${fmt(row.ps)}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot><tr style="font-weight:600;border-top:2px solid var(--border)">
          <td>TOTAL</td>
          ${cols.map(c=>`<td class="num">$${fmt(TOTALS[c.key])}</td>`).join('')}
          <td class="num">$${fmt(
            (vis.r?TOTALS[m==='neto'?'rn':'rb']:0)+
            (vis.c?TOTALS[m==='neto'?'cn':'cb']:0)+
            (vis.s?TOTALS[m==='neto'?'sn':'sb']:0)
          )}</td>
          <td class="num" style="color:var(--r-color)">$${fmt(TOTALS.pr)}</td>
          <td class="num" style="color:var(--c-color)">$${fmt(TOTALS.pc)}</td>
          <td class="num" style="color:var(--s-color)">$${fmt(TOTALS.ps)}</td>
        </tr></tfoot>
      </table></div>
    </div>
    <p style="margin-top:10px;font-size:12px;color:var(--fg-faint)">
      Modo: <strong>${m==='neto'?'Neto (sin IVA 9,5%)':'Bruto (con IVA 9,5%)'}</strong>
    </p>`;
}

renderTiles();
renderTable();
</script>
</body>
</html>
