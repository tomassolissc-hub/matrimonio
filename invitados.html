<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitados — Matrimonio 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="index.html">💍 Matrimonio 2026</a>
    <ul class="site-nav-links">
      <li><a href="index.html">Panel</a></li>
      <li><a href="gastos.html">Gastos</a></li>
      <li><a href="invitados.html">Invitados</a></li>
      <li><a href="pagos.html">Pagos</a></li>
      <li><a href="familia.html">Mi resumen</a></li>
      <li><a href="liquidacion.html"><strong>Liquidación</strong></a></li>
    </ul>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
  </div>
</nav>

<main class="page">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px">
    <div>
      <h1 class="page-title" style="margin-bottom:2px">Lista de invitados</h1>
      <p class="page-subtitle" id="subtitle" style="margin:0">Cargando…</p>
    </div>
    <button class="btn btn-primary" onclick="openModal()" style="flex-shrink:0;margin-top:4px">+ Agregar invitado</button>
  </div>

  <!-- Gráfico Full vs Fiesta -->
  <div id="tipo-chart" style="margin-top:16px;margin-bottom:16px;display:none">
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="width:52px;font-size:12px;font-weight:600;color:var(--fg-muted)">Full</span>
        <div style="flex:1;height:22px;background:var(--border);border-radius:6px;overflow:hidden;position:relative">
          <div id="bar-full" style="height:100%;background:var(--accent-fg,#b59a6a);border-radius:6px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;box-sizing:border-box;min-width:32px">
            <span id="lbl-full" style="font-size:11px;font-weight:700;color:#fff"></span>
          </div>
        </div>
        <span id="n-full" style="width:36px;font-size:12px;font-weight:700;color:var(--fg);text-align:right"></span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="width:52px;font-size:12px;font-weight:600;color:var(--fg-muted)">Fiesta</span>
        <div style="flex:1;height:22px;background:var(--border);border-radius:6px;overflow:hidden;position:relative">
          <div id="bar-fiesta" style="height:100%;background:var(--s-color,#2e7d52);border-radius:6px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;box-sizing:border-box;min-width:32px">
            <span id="lbl-fiesta" style="font-size:11px;font-weight:700;color:#fff"></span>
          </div>
        </div>
        <span id="n-fiesta" style="width:36px;font-size:12px;font-weight:700;color:var(--fg);text-align:right"></span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="width:52px;font-size:12px;font-weight:600;color:var(--fg-muted)">S/info</span>
        <div style="flex:1;height:22px;background:var(--border);border-radius:6px;overflow:hidden;position:relative">
          <div id="bar-otro" style="height:100%;background:var(--fg-faint,#aaa);border-radius:6px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;box-sizing:border-box;min-width:32px">
            <span id="lbl-otro" style="font-size:11px;font-weight:700;color:#fff"></span>
          </div>
        </div>
        <span id="n-otro" style="width:36px;font-size:12px;font-weight:700;color:var(--fg);text-align:right"></span>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="subfilters" style="margin-bottom:12px"></div>
  <div class="search-wrap">
    <input class="search-input" id="search" type="search" placeholder="Buscar invitado…" autocomplete="off">
  </div>
  <div id="root"><div class="loading"><div class="spinner"></div> Cargando…</div></div>
</main>

<!-- Modal agregar invitado -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--bg);border-radius:16px;padding:24px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h2 style="margin:0;font-size:18px">Agregar invitado</h2>
      <button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--fg-muted);line-height:1">×</button>
    </div>
    <form id="add-form" onsubmit="submitGuest(event)" autocomplete="off">
      <div style="display:flex;gap:10px;margin-bottom:12px">
        <div style="flex:1">
          <label style="font-size:12px;color:var(--fg-muted);display:block;margin-bottom:4px">Nombre *</label>
          <input id="f-nombre" type="text" required placeholder="Ej: María" autocomplete="off"
            style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14px">
        </div>
        <div style="flex:1">
          <label style="font-size:12px;color:var(--fg-muted);display:block;margin-bottom:4px">Apellido</label>
          <input id="f-apellido" type="text" placeholder="Ej: González" autocomplete="off"
            style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14px">
        </div>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--fg-muted);display:block;margin-bottom:4px">Invitación *</label>
        <select id="f-invitacion" required
          style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14px">
          <option value="">Seleccionar…</option>
          <option value="Riedel Palma">Riedel Palma</option>
          <option value="Anto">Anto (Riedel Palma)</option>
          <option value="Chico">Chico</option>
          <option value="Solís">Solís (Solís Soto)</option>
          <option value="Soto">Soto (Solís Soto)</option>
        </select>
      </div>
      <div style="margin-bottom:20px">
        <label style="font-size:12px;color:var(--fg-muted);display:block;margin-bottom:4px">Tipo</label>
        <select id="f-tipo"
          style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14px">
          <option value="">Sin especificar</option>
          <option value="Adulto">Adulto</option>
          <option value="Niño">Niño</option>
          <option value="Bebé">Bebé</option>
        </select>
      </div>
      <div style="display:flex;gap:10px">
        <button type="button" onclick="closeModal()" class="btn" style="flex:1">Cancelar</button>
        <button type="submit" id="submit-btn" class="btn btn-primary" style="flex:1">Agregar</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { apiFetch, apiPost, initTheme, highlightNav, showError, toast } from './api.js';

initTheme();
highlightNav();

let guests = null;
let current = 'riedel';
let subfilter = 'all';

const SUBFILTERS = {
  riedel: ['Todos', 'Anto', 'Riedel Palma'],
  chico:  null,
  solis:  ['Todos', 'Solís', 'Soto'],
};
const LABELS = { riedel: 'Riedel Palma', chico: 'Chico', solis: 'Solís Soto' };

const root     = document.getElementById('root');
const tabsEl   = document.getElementById('tabs');
const subEl    = document.getElementById('subfilters');
const searchEl = document.getElementById('search');

function renderChart() {
  const all = ['riedel','chico','solis'].flatMap(k => guests[k] || []);
  let full = 0, fiesta = 0, otro = 0;
  all.forEach(g => {
    const t = (g.tipo || '').trim();
    if (t === 'Full')   full++;
    else if (t === 'Fiesta') fiesta++;
    else otro++;
  });
  const total = all.length || 1;
  const chartEl = document.getElementById('tipo-chart');
  chartEl.style.display = '';

  document.getElementById('bar-full').style.width   = Math.max(4, Math.round(full   / total * 100)) + '%';
  document.getElementById('bar-fiesta').style.width = Math.max(4, Math.round(fiesta / total * 100)) + '%';
  document.getElementById('bar-otro').style.width   = Math.max(4, Math.round(otro   / total * 100)) + '%';

  document.getElementById('lbl-full').textContent   = Math.round(full   / total * 100) + '%';
  document.getElementById('lbl-fiesta').textContent = Math.round(fiesta / total * 100) + '%';
  document.getElementById('lbl-otro').textContent   = Math.round(otro   / total * 100) + '%';

  document.getElementById('n-full').textContent   = full;
  document.getElementById('n-fiesta').textContent = fiesta;
  document.getElementById('n-otro').textContent   = otro;
}

async function load() {
  try {
    guests = await apiFetch('guests');
    renderTabs();
    renderSubfilters();
    renderGuests();
    renderChart();
  } catch(e) {
    showError(root, e.message);
  }
}

function renderTabs() {
  tabsEl.innerHTML = ['riedel','chico','solis'].map(k => `
    <button class="tab-btn ${k === current ? 'active' : ''}" onclick="setFamily('${k}')">
      ${LABELS[k]} <span style="font-size:11px;opacity:.6">(${(guests[k]||[]).length})</span>
    </button>
  `).join('');
}

function renderSubfilters() {
  const sf = SUBFILTERS[current];
  if (!sf) { subEl.innerHTML = ''; return; }
  subEl.innerHTML = `<div class="tabs" style="border:none;margin:0;gap:6px">
    ${sf.map(s => `
      <button class="tab-btn ${(s==='Todos'?'all':s)===subfilter?'active':''}"
              onclick="setSub('${s==='Todos'?'all':s}')"
              style="padding:6px 12px;font-size:12px">
        ${s}
      </button>`).join('')}
  </div>`;
}

function renderGuests() {
  const q   = searchEl.value.trim().toLowerCase();
  const all = guests[current] || [];
  let list  = subfilter === 'all' ? all
    : subfilter === 'Riedel Palma' ? all.filter(g => !g.g || g.g === 'Riedel Palma')
    : all.filter(g => g.g === subfilter);
  if (q) list = list.filter(g => g.n.toLowerCase().includes(q));

  const count = all.length;
  const shown = list.length;
  const total = (guests.riedel||[]).length + (guests.chico||[]).length + (guests.solis||[]).length;

  document.getElementById('subtitle').textContent =
    `${total} en total · ${count} en ${LABELS[current]}${q || subfilter!=='all' ? ` · mostrando ${shown}` : ''}`;

  if (!list.length) {
    root.innerHTML = `<p style="color:var(--fg-muted);padding:20px 0;font-size:13px">Sin resultados.</p>`;
    return;
  }

  root.innerHTML = `<div class="guest-grid">
    ${list.map(g => `
      <div class="guest-item" data-id="${g.id || ''}">
        <span class="guest-name">${g.n}</span>
        ${g.tipo ? `<span class="guest-tipo">${g.tipo}</span>` : ''}
        ${g.g    ? `<span class="guest-tag">${g.g}</span>` : ''}
        <button class="btn-delete-guest" title="Eliminar invitado"
                onclick="deleteGuest('${(g.id||'').toString().replace(/'/g,"\\'")}', '${g.n.replace(/'/g,"\\'")}', this)">✕</button>
      </div>
    `).join('')}
  </div>`;
}

window.setFamily = (k) => {
  current = k; subfilter = 'all'; searchEl.value = '';
  renderTabs(); renderSubfilters(); renderGuests();
};
window.setSub = (s) => {
  subfilter = s; renderSubfilters(); renderGuests();
};
searchEl.addEventListener('input', renderGuests);

window.deleteGuest = async (id, name, btn) => {
  if (!id) { toast('Este invitado no tiene ID — no se puede borrar desde aquí.', false); return; }
  if (!confirm(`¿Eliminar a ${name} de la lista?`)) return;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    await apiPost({ action: 'deleteGuest', id });
    // Quitar del estado local
    for (const k of ['riedel','chico','solis']) {
      guests[k] = (guests[k] || []).filter(g => String(g.id) !== String(id));
    }
    toast(`${name} eliminado/a`);
    renderTabs();
    renderGuests();
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '✕';
    toast(e.message, false);
  }
};

// ── Modal agregar ────────────────────────────────────────────
const overlay = document.getElementById('modal-overlay');
window.openModal = () => {
  overlay.style.display = 'flex';
  document.getElementById('f-nombre').focus();
};
window.closeModal = () => {
  overlay.style.display = 'none';
  document.getElementById('add-form').reset();
};
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

window.submitGuest = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Agregando…';
  const data = {
    nombre:     document.getElementById('f-nombre').value.trim(),
    apellido:   document.getElementById('f-apellido').value.trim(),
    invitacion: document.getElementById('f-invitacion').value,
    tipo:       document.getElementById('f-tipo').value,
  };
  try {
    const res = await apiPost({ action: 'addGuest', data });
    if (!res.ok) throw new Error(res.error || 'Error al agregar');
    // Agregar al estado local para no recargar
    const inv = data.invitacion.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    const nombreCompleto = [data.nombre, data.apellido].filter(Boolean).join(' ');
    const entry = { id: res.id, n: nombreCompleto, g: '', tipo: data.tipo };
    if (inv === 'riedel palma' || inv === 'riedel') {
      guests.riedel.push(entry);
    } else if (inv === 'anto') {
      guests.riedel.push({ ...entry, g: 'Anto' });
    } else if (inv === 'chico') {
      guests.chico.push(entry);
    } else if (inv === 'solis') {
      guests.solis.push({ ...entry, g: 'Solís' });
    } else if (inv === 'soto') {
      guests.solis.push({ ...entry, g: 'Soto' });
    }
    // Ir a la familia correcta
    if (['riedel palma','riedel','anto'].includes(inv)) current = 'riedel';
    else if (inv === 'chico') current = 'chico';
    else current = 'solis';
    closeModal();
    toast(`${nombreCompleto} agregado/a ✓`);
    renderTabs(); renderSubfilters(); renderGuests();
  } catch(err) {
    toast(err.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Agregar';
  }
};

load();
</script>
</body>
</html>
